async function circuitWiringEncounter(region) {
  const regionCat = region.categories[0];
  let candidates = CIRCUIT_WIRING_CHALLENGES.filter(c => c.category === regionCat);
  if (candidates.length === 0) candidates = CIRCUIT_WIRING_CHALLENGES;
  const challenge = candidates[Math.floor(Math.random() * candidates.length)];
  addMsg(`<div class="msg-challenge"><strong>Build Subsystem Component</strong><br>Goal: <em>${challenge.goal}</em></div>`);
  const allParts = [...challenge.correctOrder, ...challenge.distractors].sort(() => Math.random() - 0.5);
  const slotFills = new Array(challenge.slots.length).fill(null);
  let usedParts = new Set();
  let selectedSlotIdx = null;

  function renderWiringUI() {
    document.querySelectorAll('.wiring-ui-container').forEach(el => el.remove());
    const container = document.createElement('div');
    container.className = 'wiring-ui-container';
    const instr = document.createElement('p');
    instr.style.cssText = 'font-size:0.85rem; color:var(--text-dim); margin-bottom:6px;';
    instr.textContent = selectedSlotIdx !== null ? `Slot ${selectedSlotIdx + 1} selected -- tap a part.` : 'Tap a slot, then a part.';
    container.appendChild(instr);
    const slotsDiv = document.createElement('div');
    slotsDiv.setAttribute('aria-label', 'Circuit slots');
    challenge.slots.forEach((slotName, i) => {
      const slot = document.createElement('div');
      slot.className = 'wiring-slot' + (slotFills[i] ? ' filled' : '') + (selectedSlotIdx === i ? ' selected-slot' : '');
      slot.innerHTML = `<span class="slot-label">${i+1}. ${slotName}:</span> <span class="slot-component">${slotFills[i] || '(empty)'}</span>`;
      slot.setAttribute('aria-label', `Slot ${i+1}: ${slotName}`);
      slot.onclick = () => { if (slotFills[i]) { usedParts.delete(slotFills[i]); slotFills[i] = null; selectedSlotIdx = i; } else { selectedSlotIdx = i; } renderWiringUI(); };
      slotsDiv.appendChild(slot);
    });
    container.appendChild(slotsDiv);
    const partsDiv = document.createElement('div');
    partsDiv.className = 'wiring-parts';
    allParts.forEach(part => {
      const btn = document.createElement('button');
      btn.className = 'wiring-part' + (usedParts.has(part) ? ' used' : '');
      btn.textContent = part;
      btn.disabled = usedParts.has(part);
      btn.onclick = () => {
        if (usedParts.has(part)) return;
        let idx = selectedSlotIdx;
        if (idx === null || slotFills[idx] !== null) idx = slotFills.indexOf(null);
        if (idx >= 0 && idx < slotFills.length) { slotFills[idx] = part; usedParts.add(part); selectedSlotIdx = slotFills.indexOf(null); renderWiringUI(); }
      };
      partsDiv.appendChild(btn);
    });
    container.appendChild(partsDiv);
    document.getElementById('narrative').appendChild(container);
    container.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }
  renderWiringUI();
  showChoices([{ text: 'Submit build', id: 'submit_wiring' }, { text: 'Clear all', id: 'clear_wiring' }], async function wiringHandler(choice) {
    if (choice.id === 'clear_wiring') { slotFills.fill(null); usedParts.clear(); selectedSlotIdx = null; renderWiringUI(); showChoices([{ text: 'Submit build', id: 'submit_wiring' }, { text: 'Clear all', id: 'clear_wiring' }], wiringHandler); return; }
    let correctCount = 0;
    document.querySelectorAll('.wiring-ui-container').forEach(el => el.remove());
    for (let i = 0; i < challenge.slots.length; i++) {
      const isCorrect = slotFills[i] === challenge.correctOrder[i];
      if (isCorrect) correctCount++;
      addMsg(`<div class="wiring-slot ${isCorrect ? 'correct-slot' : 'wrong-slot'}"><span class="slot-label">${challenge.slots[i]}:</span> <span class="slot-component">${slotFills[i] || '(empty)'} -- ${isCorrect ? 'Correct' : 'Wrong'}</span>${!isCorrect ? `<br><small style="color:var(--text-dim)">Needed: ${challenge.correctOrder[i]}</small>` : ''}</div>`);
    }
    if (correctCount === challenge.slots.length) {
      addMsg(`All connections correct! Component built successfully.`, 'success');
      checkAchievement('circuit_wiring');
      for (const topic of region.topics) await trackMastery(topic, true, 3, null);
      addClue(region, 'circuit-wiring');
    } else if (correctCount >= challenge.slots.length / 2) {
      addMsg(`${correctCount}/${challenge.slots.length} correct. Almost.`, 'system');
      onPartialAnswer();
    } else {
      addMsg(`Only ${correctCount}/${challenge.slots.length}. Build fails.`, 'combat');
      onIncorrectAnswer();
    }
    addMsg(`<div class="knowledge-reveal"><h4>How It Works</h4><p>${challenge.explanation}</p></div>`);
    await continueOrMap(region);
  });
}

async function faultTreeEncounter(region) {
  const regionCat = region.categories[0];
  let candidates = FAULT_TREE_CHALLENGES.filter(c => c.category === regionCat);
  if (candidates.length === 0) candidates = FAULT_TREE_CHALLENGES;
  const challenge = candidates[Math.floor(Math.random() * candidates.length)];
  addMsg(`<div class="msg-challenge"><strong>Fault Diagnosis: ${challenge.title}</strong><br>${challenge.symptoms}</div>`);
  const usedSteps = new Set();
  let stepsUsed = 0;
  function showDiagnosticSteps() {
    const container = document.getElementById('choice-container');
    container.innerHTML = '';
    challenge.steps.forEach((step, i) => {
      const btn = document.createElement('button');
      btn.className = 'fault-step-btn' + (usedSteps.has(i) ? ' used-step' : '');
      btn.innerHTML = `${usedSteps.has(i) ? 'Done: ' : ''}${step.action}`;
      btn.setAttribute('aria-label', `${step.action}`);
      btn.disabled = usedSteps.has(i);
      btn.onclick = () => {
        if (usedSteps.has(i)) return;
        usedSteps.add(i); stepsUsed++;
        const resultText = step.eliminates ? `<span style="color:var(--success)">Ruled out: ${step.eliminates}</span>` : `<span style="color:var(--warning)">Clue: ${step.reveals}</span>`;
        addMsg(`<div class="fault-info"><div class="fault-label">${step.action}</div><div class="fault-data">${step.result}<br>${resultText}</div></div>`);
        if (step.reveals && step.reveals.includes('ROOT CAUSE')) { addMsg(`Root cause found!`, 'success'); finalizeFaultTree(true); return; }
        showDiagnosticSteps();
      };
      container.appendChild(btn);
    });
    if (stepsUsed >= challenge.minStepsToSolve) {
      const diagnoseBtn = document.createElement('button');
      diagnoseBtn.className = 'choice-btn';
      diagnoseBtn.innerHTML = `<span class="key-hint">[D]</span> Declare root cause`;
      diagnoseBtn.onclick = () => {
        addMsg(`State your diagnosis.`, 'challenge');
        showChoices([{ text: 'Diagnose (type below)', id: 'diagnose' }], async (choice) => {
          if (choice.freeformInput) {
            const result = await evaluateAnswer(choice.freeformInput, challenge.rootCause, challenge.title);
            if (result.grade === 'correct') finalizeFaultTree(true);
            else { if (result.feedback) addMsg(`<em>${result.feedback}</em>`, 'system'); finalizeFaultTree(false); }
          } else showDiagnosticSteps();
        });
      };
      container.appendChild(diagnoseBtn);
    }
    const giveUpBtn = document.createElement('button');
    giveUpBtn.className = 'choice-btn';
    giveUpBtn.innerHTML = `<span class="key-hint">[X]</span> Give up`;
    giveUpBtn.onclick = () => finalizeFaultTree(false);
    container.appendChild(giveUpBtn);
    document.getElementById('input-row').style.display = 'none';
  }
  async function finalizeFaultTree(solved) {
    document.getElementById('input-row').style.display = 'flex';
    if (solved) {
      addMsg(`<div class="mastery-card"><h4>Fault Diagnosed!</h4><p>${challenge.rootCause}</p></div>`);
      checkAchievement('fault_tree');
      for (const topic of region.topics) await trackMastery(topic, true, 4, null);
      addClue(region, 'fault-tree');
    } else {
      addMsg(`<div class="knowledge-reveal"><h4>Root Cause</h4><p>${challenge.rootCause}</p></div>`);
      onIncorrectAnswer();
    }
    await continueOrMap(region);
  }
  showDiagnosticSteps();
}

async function exploreEncounter(region) {
  addMsg(`You explore ${region.name}. Systems hum quietly.`);
  await continueOrMap(region);
}

// ============================================================
// CLUES + MYSTERY + CROSS-TOPIC
// ============================================================
function addClue(region, clueKey) {
  const mp = state.mysteryProgress[region.id];
  if (!mp || mp.solved) return;
  if (!mp.cluesFound.includes(clueKey)) {
    mp.cluesFound.push(clueKey);
    addMsg(`<span class="msg-reward">Clue found! (${mp.cluesFound.length} for ${region.name}'s mystery)</span>`, 'reward');
    if (mp.cluesFound.length >= 3) addMsg(`Enough clues to attempt the mystery!`, 'system');
  }
  saveState();
}

async function crossTopicChallenge() {
  clearNarrative();
  addMsg(`<div class="msg-challenge"><strong>Cross-Domain Synthesis</strong><br>Combine knowledge from multiple subsystems!</div>`);
  try {
    const cats = REGIONS.filter(r => { const mp = state.mysteryProgress[r.id]; return mp && mp.cluesFound && mp.cluesFound.length >= 2; }).map(r => r.categories[0]);
    if (cats.length < 2) { addMsg('Not enough domain experience.', 'system'); clearNarrative(); showWorldMap(); return; }
    const insights = await api(`/api/topics/insights?categories=${encodeURIComponent(cats.join(','))}`);
    if (insights.length < 2) { addMsg('Could not find topics.', 'system'); clearNarrative(); showWorldMap(); return; }
    const [topicA, topicB] = [insights[0], insights[1]];
    const question = `How does ${topicA.topic} relate to ${topicB.topic}?`;
    addMsg(`<div class="msg-cascade"><h4>Cross-Domain</h4><p>${question}</p></div>`);
    showChoices([{ text: 'Explain (type below)', id: 'explain' }], async (choice) => {
      if (choice.freeformInput) {
        const correctAnswer = `${topicA.key_insight || topicA.tldr || topicA.topic} connects to ${topicB.key_insight || topicB.tldr || topicB.topic}`;
        const result = await evaluateAnswer(choice.freeformInput, correctAnswer, question);
        if (result.grade === 'correct') { addMsg(`Excellent cross-domain insight!`, 'success'); state.crossTopicSolved++; onCorrectAnswer(); }
        else { addMsg(`<div class="knowledge-reveal"><h4>Connection</h4><p>${correctAnswer}</p></div>`); if (result.grade === 'partial') onPartialAnswer(); else onIncorrectAnswer(); }
        if (result.feedback) addMsg(`<em>${result.feedback}</em>`, 'system');
      }
      saveState(); updateHUD(); clearNarrative(); showWorldMap();
    });
  } catch (e) { addMsg('Failed to load.', 'system'); clearNarrative(); showWorldMap(); }
}

// ============================================================
// CONTINUE OR MAP
// ============================================================
async function continueOrMap(region) {
  const mp = state.mysteryProgress[region.id];
  if (mp && !mp.solved && mp.cluesFound && mp.cluesFound.length >= 3) {
    addMsg(`<div class="msg-cascade"><strong>Mystery ready!</strong></div>`);
    showChoices([
      { text: 'Attempt the mystery', id: 'mystery' },
      { text: 'Continue exploring', id: 'continue' },
      { text: 'Return to board', id: 'map' },
    ], async (choice) => {
      if (choice.id === 'mystery') await attemptMystery(region);
      else if (choice.id === 'continue') { clearNarrative(); await enterRegion(region); }
      else { clearNarrative(); showWorldMap(); }
    });
    return;
  }
  showChoices([
    { text: 'Continue exploring', id: 'continue' },
    { text: 'Return to board', id: 'map' },
  ], async (choice) => {
    if (choice.id === 'continue') { clearNarrative(); await enterRegion(region); }
    else { clearNarrative(); showWorldMap(); }
  });
}

async function attemptMystery(region) {
  addMsg(`<div class="msg-challenge"><strong>Mystery: ${region.name}</strong><br>${region.mystery}</div>`);
  showChoices([{ text: 'Solve (type below)', id: 'solve' }], async (choice) => {
    if (choice.freeformInput) {
      const result = await evaluateAnswer(choice.freeformInput, region.mysteryAnswer, region.mystery);
      if (result.grade === 'correct' || result.grade === 'partial') {
        state.mysteryProgress[region.id].solved = true;
        addMsg(`<div class="achievement-banner"><h4>Mystery Solved: ${region.name}!</h4><p>${region.mysteryAnswer}</p></div>`);
        checkAchievement('mystery_1');
        if (REGIONS.every(r => state.mysteryProgress[r.id]?.solved)) checkAchievement('mystery_all');
        onCorrectAnswer();
      } else { addMsg(`Not quite. Keep gathering clues.`, 'system'); onIncorrectAnswer(); }
      if (result.feedback) addMsg(`<em>${result.feedback}</em>`, 'system');
    }
    saveState(); updateHUD();
    await continueOrMap(region);
  });
}

// ============================================================
// LIBRARY + JOURNAL
// ============================================================
async function visitLibrary() {
  clearNarrative();
  addMsg(`The <strong>Knowledge Library</strong> glows. Search for any topic.`);
  showChoices([
    { text: 'Search (type below)', id: 'search' },
    { text: 'Return to board', id: 'back' },
  ], async (choice) => {
    if (choice.id === 'search' || choice.freeformInput) {
      const query = choice.freeformInput || '';
      if (query) {
        try {
          const results = await api(`/api/search?q=${encodeURIComponent(query)}`);
          if (results.length > 0) results.slice(0, 5).forEach(r => { addMsg(`<div class="knowledge-reveal"><h4>${r.topic} <small>(${r.tier})</small></h4><p>${r.tldr || r.definition || ''}</p></div>`); });
          else addMsg(`No results for "${query}".`, 'system');
        } catch (e) { addMsg('Search failed.', 'system'); }
      }
      await visitLibrary();
    } else { clearNarrative(); showWorldMap(); }
  });
}

function showKnowledgeJournal() {
  addMsg(`<div class="mastery-card"><h4>Knowledge Journal -- ${state.knowledgeJournal.length} entries</h4></div>`);
  if (state.knowledgeJournal.length === 0) { addMsg(`Journal empty. Power nodes to fill it.`, 'system'); return; }
  state.knowledgeJournal.slice(-10).reverse().forEach(entry => {
    const conn = entry.connections.length > 0 ? `<br><span class="journal-connection">Traces to: ${entry.connections.join(', ')}</span>` : '';
    addMsg(`<div class="journal-entry"><strong>${entry.topic}</strong>: ${entry.insight}${conn}</div>`);
  });
  if (state.conceptCascadesTriggered.length > 0) {
    addMsg(`<div class="journal-entry" style="border-color:var(--warning);"><strong>Discovered Traces:</strong><br>${state.conceptCascadesTriggered.map(p => { const c = CONCEPT_CASCADES[p]; return c ? `${c.name} (${p.replace('+', ' -- ')})` : p; }).join('<br>')}</div>`);
  }
}

// ============================================================
// SAVE / LOAD
// ============================================================
function saveState() {
  try {
    localStorage.setItem('knowledge-quest-save', JSON.stringify({
      char: state.char,
      masteredTopics: state.masteredTopics,
      visitedRegions: state.visitedRegions,
      turnCount: state.turnCount,
      mysteryProgress: state.mysteryProgress,
      hintsUsed: state.hintsUsed,
      crossTopicSolved: state.crossTopicSolved || 0,
      conceptCascadesTriggered: state.conceptCascadesTriggered || [],
      knowledgeJournal: state.knowledgeJournal || [],
      tutorialComplete: state.tutorialComplete || false,
      regionNPCs: state.regionNPCs || {},
      lastEncounteredTopic: state.lastEncounteredTopic || null,
      cascadeEncountersSinceLastTrigger: state.cascadeEncountersSinceLastTrigger || {},
      streak: state.streak || 0,
      bestStreak: state.bestStreak || 0,
      combo: 0,
      achievements: state.achievements || [],
      totalCorrect: state.totalCorrect || 0,
      totalAttempts: state.totalAttempts || 0,
      dailyChallengesCompleted: state.dailyChallengesCompleted || {},
      apprenticeTeachCount: state.apprenticeTeachCount || 0,
      bossesDefeated: state.bossesDefeated || [],
      discoveredTraces: state.discoveredTraces || [],
    }));
  } catch (e) {}
}

function loadState() {
  try {
    const saved = localStorage.getItem('knowledge-quest-save');
    if (saved) {
      const data = JSON.parse(saved);
      Object.assign(state, {
        char: data.char,
        masteredTopics: data.masteredTopics || {},
        visitedRegions: data.visitedRegions || [],
        turnCount: data.turnCount || 0,
        mysteryProgress: data.mysteryProgress || {},
        hintsUsed: data.hintsUsed || 0,
        crossTopicSolved: data.crossTopicSolved || 0,
        conceptCascadesTriggered: data.conceptCascadesTriggered || [],
        knowledgeJournal: data.knowledgeJournal || [],
        tutorialComplete: data.tutorialComplete || false,
        regionNPCs: data.regionNPCs || {},
        lastEncounteredTopic: data.lastEncounteredTopic || null,
        cascadeEncountersSinceLastTrigger: data.cascadeEncountersSinceLastTrigger || {},
        streak: data.streak || 0,
        bestStreak: data.bestStreak || 0,
        combo: 0,
        achievements: data.achievements || [],
        totalCorrect: data.totalCorrect || 0,
        totalAttempts: data.totalAttempts || 0,
        dailyChallengesCompleted: data.dailyChallengesCompleted || {},
        apprenticeTeachCount: data.apprenticeTeachCount || 0,
        bossesDefeated: data.bossesDefeated || [],
        discoveredTraces: data.discoveredTraces || [],
      });
      Object.values(state.masteredTopics).forEach(entry => {
        if (!entry.halfLife) entry.halfLife = HALF_LIFE_INITIAL_MS;
        if (!entry.lastReviewed) entry.lastReviewed = entry.lastSeen || Date.now();
      });
      // Migration: strip old class system
      if (state.char && state.char.class) {
        state.char = { name: state.char.name };
      }
      // BUG-001 FIX: persist migration immediately
      saveState();
      return true;
    }
  } catch (e) {}
  return false;
}

// ============================================================
// PREMIUM
// ============================================================
const premiumFeatures = { enabled: false, features: { bonusRegions: ['Quantum Realm', 'Electromagnetic Field'], cosmetics: ['Golden Traces', 'Plasma Glow'], challengeModes: ['No-Hint', 'Speedrun', 'Master'] } };

// ============================================================
// THEME + FONT
// ============================================================
function initThemeToggle() {
  const btn = document.getElementById('theme-toggle');
  const saved = localStorage.getItem('kq-theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  btn.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('kq-theme', next);
  });
}

function initFontToggle() {
  const btn = document.getElementById('font-toggle');
  const saved = localStorage.getItem('kq-fontsize') || 'medium';
  document.documentElement.setAttribute('data-fontsize', saved);
  updateFontToggleLabel(saved);
  btn.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-fontsize') || 'medium';
    const idx = FONT_SIZES.indexOf(current);
    const next = FONT_SIZES[(idx + 1) % FONT_SIZES.length];
    document.documentElement.setAttribute('data-fontsize', next);
    localStorage.setItem('kq-fontsize', next);
    updateFontToggleLabel(next);
  });
}

function updateFontToggleLabel(size) {
  const btn = document.getElementById('font-toggle');
  btn.textContent = { small: 'Aa-', medium: 'Aa', large: 'Aa+' }[size] || 'Aa';
  btn.title = `Font size: ${size}`;
}

// ============================================================
// INIT
// ============================================================
async function init() {
  initThemeToggle();
  initFontToggle();
  initHelpToggle();
  try {
    state.dbStats = await api('/api/stats');
    if (state.dbStats.documents === 0) { document.getElementById('loading').innerHTML = '<p>Knowledge base empty. Run importer.</p>'; return; }
    if (loadState()) {
      document.getElementById('loading').style.display = 'none';
      state.phase = 'playing';
      document.getElementById('narrative').style.display = 'block';
      document.getElementById('actions').style.display = 'block';
      document.getElementById('footer').style.display = 'block';
      updateHUD();
      const title = getTitle();
      addMsg(`Welcome back, ${state.char.name}! Board at ${Math.round(getBoardPower()*100)}% power. Title: ${title.name}.`, 'system');
      const fading = getFadingTopics();
      if (fading.length > 0) addMsg(`<div class="signal-alert"><h4>Signal Degrading</h4><p>${fading.length} node(s) losing power!</p></div>`);
      if (!isDailyChallengeCompleted()) addMsg(`<span class="daily-badge">DAILY</span> Daily diagnostic available!`, 'system');
      showWorldMap();
    } else {
      initCharCreation();
    }
  } catch (err) {
    document.getElementById('loading').innerHTML = `<p>Could not connect. Is Docker running?</p><p style="color:var(--danger)">${err.message}</p>`;
  }
}

init();
</script>
