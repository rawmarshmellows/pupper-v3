<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Knowledge Quest</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d1117;
    --bg-panel: #161b22;
    --bg-card: #1c2333;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --accent-glow: rgba(88,166,255,0.15);
    --success: #3fb950;
    --warning: #d29922;
    --danger: #f85149;
    --hp-bar: #3fb950;
    --mp-bar: #bc8cff;
    --xp-bar: #58a6ff;
    --gold: #d29922;
    --radius: 8px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  html { font-size: 16px; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
  }

  #hud {
    position: sticky; top: 0; z-index: 100;
    background: var(--bg-panel);
    border-bottom: 1px solid #30363d;
    padding: 8px 12px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    font-size: 0.85rem;
  }
  .hud-name { font-weight: 700; color: var(--accent); margin-right: auto; }
  .hud-stat { display: flex; align-items: center; gap: 4px; }
  .hud-bar { width: 60px; height: 8px; background: #30363d; border-radius: 4px; overflow: hidden; }
  .hud-bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s ease; }
  .hud-bar-hp .hud-bar-fill { background: var(--hp-bar); }
  .hud-bar-mp .hud-bar-fill { background: var(--mp-bar); }
  .hud-bar-xp .hud-bar-fill { background: var(--xp-bar); }
  .hud-gold { color: var(--gold); font-weight: 600; }
  .hud-level { background: var(--accent); color: var(--bg); padding: 2px 8px; border-radius: 10px; font-weight: 700; font-size: 0.75rem; }

  #narrative {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 16px; max-width: 600px; width: 100%; margin: 0 auto;
  }
  .msg { margin-bottom: 16px; line-height: 1.6; animation: fadeIn 0.3s ease; }
  .msg-narrator { color: var(--text); }
  .msg-system { color: var(--text-dim); font-style: italic; font-size: 0.9rem; }
  .msg-combat { color: var(--danger); }
  .msg-success { color: var(--success); }
  .msg-lore { color: var(--accent); border-left: 3px solid var(--accent); padding-left: 12px; background: var(--accent-glow); border-radius: 0 var(--radius) var(--radius) 0; padding: 8px 12px; }
  .msg-challenge { background: var(--bg-card); border: 1px solid #30363d; border-radius: var(--radius); padding: 12px; }
  .msg-reward { color: var(--gold); font-weight: 600; }
  .msg-hint { color: var(--warning); font-size: 0.9rem; font-style: italic; }
  .roll-result { font-family: monospace; color: var(--warning); }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* Circuit diagram display */
  .circuit-diagram {
    background: #0a0e14; border: 1px solid #30363d; border-radius: var(--radius);
    padding: 12px; margin: 8px 0; font-family: monospace; font-size: 0.85rem;
    white-space: pre; overflow-x: auto; color: var(--accent); line-height: 1.4;
  }

  /* Component selector */
  .component-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 8px; margin: 8px 0;
  }
  .component-btn {
    padding: 10px 8px; background: var(--bg-card); border: 2px solid #30363d;
    border-radius: var(--radius); color: var(--text); cursor: pointer;
    text-align: center; font-size: 0.85rem; min-height: 44px;
    transition: all 0.15s ease;
  }
  .component-btn:hover { border-color: var(--accent); background: var(--accent-glow); }
  .component-btn.selected { border-color: var(--success); background: rgba(63,185,80,0.1); }
  .component-btn.wrong { border-color: var(--danger); background: rgba(248,81,73,0.1); }

  /* Knowledge reveal (post-challenge) */
  .knowledge-reveal {
    background: var(--bg-card); border: 1px solid var(--success); border-radius: var(--radius);
    padding: 12px; margin: 8px 0;
  }
  .knowledge-reveal h4 { color: var(--success); margin-bottom: 6px; font-size: 0.9rem; }
  .knowledge-reveal p { font-size: 0.9rem; line-height: 1.5; color: var(--text-dim); }

  #actions {
    position: sticky; bottom: 0;
    background: var(--bg-panel); border-top: 1px solid #30363d;
    padding: 12px; max-width: 600px; width: 100%; margin: 0 auto;
  }
  .choice-btn {
    display: block; width: 100%; padding: 12px 16px; margin-bottom: 8px;
    background: var(--bg-card); color: var(--text); border: 1px solid #30363d;
    border-radius: var(--radius); font-size: 1rem; text-align: left;
    cursor: pointer; transition: all 0.15s ease; min-height: 44px; line-height: 1.4;
  }
  .choice-btn:hover, .choice-btn:focus { background: var(--accent-glow); border-color: var(--accent); outline: none; }
  .choice-btn:active { transform: scale(0.98); }
  .choice-btn .key-hint { color: var(--text-dim); font-size: 0.8rem; margin-right: 8px; }

  #input-row { display: flex; gap: 8px; margin-top: 4px; }
  #freeform { flex: 1; padding: 10px 12px; background: var(--bg-card); color: var(--text); border: 1px solid #30363d; border-radius: var(--radius); font-size: 1rem; min-height: 44px; }
  #freeform:focus { border-color: var(--accent); outline: none; }
  #submit-btn { padding: 10px 16px; background: var(--accent); color: var(--bg); border: none; border-radius: var(--radius); font-weight: 600; cursor: pointer; min-width: 44px; min-height: 44px; }

  #char-creation {
    max-width: 600px; margin: 0 auto; padding: 16px; width: 100%;
  }
  #char-creation h1 { color: var(--accent); margin-bottom: 8px; text-align: center; }
  #char-creation h2 { color: var(--text-dim); font-size: 1rem; margin: 16px 0 8px; }
  .class-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
  .class-btn {
    padding: 12px; background: var(--bg-card); border: 2px solid #30363d; border-radius: var(--radius);
    color: var(--text); cursor: pointer; text-align: center; font-size: 0.9rem; min-height: 44px;
    transition: all 0.15s ease;
  }
  .class-btn:hover, .class-btn.selected { border-color: var(--accent); background: var(--accent-glow); }

  .stat-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; }
  .stat-name { min-width: 40px; font-weight: 600; }
  .stat-controls { display: flex; align-items: center; gap: 8px; }
  .stat-btn { width: 36px; height: 36px; background: var(--bg-card); border: 1px solid #30363d; border-radius: 50%; color: var(--text); font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .stat-btn:hover { border-color: var(--accent); }
  .stat-val { min-width: 24px; text-align: center; font-weight: 700; font-size: 1.1rem; }
  .stat-points { text-align: center; color: var(--warning); font-weight: 600; margin: 8px 0; }

  #name-input { width: 100%; padding: 10px; background: var(--bg-card); color: var(--text); border: 1px solid #30363d; border-radius: var(--radius); font-size: 1rem; }
  #start-btn {
    display: block; width: 100%; padding: 14px; margin-top: 16px;
    background: var(--accent); color: var(--bg); border: none; border-radius: var(--radius);
    font-size: 1.1rem; font-weight: 700; cursor: pointer;
  }
  #start-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  #loading { text-align: center; padding: 40px; color: var(--text-dim); }
  .spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid #30363d; border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .premium-badge { display: inline-block; background: linear-gradient(135deg, #d29922, #f0c040); color: #000; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; }

  .region-card {
    background: var(--bg-card); border: 1px solid #30363d; border-radius: var(--radius);
    padding: 12px; margin-bottom: 8px; cursor: pointer; transition: all 0.15s ease;
  }
  .region-card:hover { border-color: var(--accent); }
  .region-card.locked { opacity: 0.5; cursor: not-allowed; }
  .region-card h4 { color: var(--accent); margin-bottom: 4px; }
  .region-card p { font-size: 0.85rem; color: var(--text-dim); }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
</style>
</head>
<body>

<div id="hud" style="display:none;">
  <span class="hud-name" id="hud-name">Hero</span>
  <span class="hud-level" id="hud-level">Lv 1</span>
  <span class="hud-stat">HP <span class="hud-bar hud-bar-hp"><span class="hud-bar-fill" id="hud-hp-bar" style="width:100%"></span></span> <span id="hud-hp-text">30/30</span></span>
  <span class="hud-stat">MP <span class="hud-bar hud-bar-mp"><span class="hud-bar-fill" id="hud-mp-bar" style="width:100%"></span></span> <span id="hud-mp-text">20/20</span></span>
  <span class="hud-stat">XP <span class="hud-bar hud-bar-xp"><span class="hud-bar-fill" id="hud-xp-bar" style="width:0%"></span></span></span>
  <span class="hud-gold" id="hud-gold">50g</span>
</div>

<div id="loading">
  <div class="spinner"></div>
  <p style="margin-top:12px;">Connecting to knowledge base...</p>
</div>

<div id="char-creation" style="display:none;">
  <h1>Knowledge Quest</h1>
  <p style="text-align:center; color:var(--text-dim); margin-bottom:16px;">An RPG where understanding IS your power</p>
  <div id="db-stats" style="text-align:center; color:var(--text-dim); font-size:0.85rem; margin-bottom:16px;"></div>
  <h2>Your Name</h2>
  <input type="text" id="name-input" placeholder="Enter your name..." maxlength="20" autocomplete="off">
  <h2>Choose Your Path</h2>
  <div class="class-grid" id="class-grid"></div>
  <h2>Distribute Stats <span class="stat-points" id="stat-points">20 points remaining</span></h2>
  <div id="stat-rows"></div>
  <button id="start-btn" disabled>Begin Your Quest</button>
</div>

<div id="narrative" style="display:none;" role="main" aria-label="Game narrative"></div>

<div id="actions" style="display:none;" role="navigation" aria-label="Game actions">
  <div id="choice-container"></div>
  <div id="input-row">
    <input type="text" id="freeform" placeholder="Or type a custom action..." autocomplete="off" aria-label="Custom action input">
    <button id="submit-btn" aria-label="Submit action">Go</button>
  </div>
</div>

<script>
// ============================================================
// GAME STATE & CONFIG
// ============================================================
const CLASSES = [
  { id: 'engineer', name: 'Engineer', desc: 'Builds and analyzes circuits', resource: 'Stamina', statBonus: 'INT' },
  { id: 'explorer', name: 'Explorer', desc: 'Discovers hidden knowledge', resource: 'Stamina', statBonus: 'WIS' },
  { id: 'artificer', name: 'Artificer', desc: 'Crafts with components', resource: 'MP', statBonus: 'DEX' },
  { id: 'scholar', name: 'Scholar', desc: 'Masters deep theory', resource: 'MP', statBonus: 'INT' },
  { id: 'tinker', name: 'Tinker', desc: 'Hacks and improvises', resource: 'Stamina', statBonus: 'DEX' },
  { id: 'sage', name: 'Sage', desc: 'Teaches and mentors', resource: 'MP', statBonus: 'WIS' },
];
const STAT_NAMES = ['STR', 'DEX', 'CON', 'INT', 'WIS', 'CHA'];
const BASE_STAT = 5, TOTAL_POINTS = 20;

const REGIONS = [
  { id: 'workshop', name: 'The Workshop', desc: 'Basic components: resistors, capacitors, inductors, diodes', tier: 'micro', difficulty: 1,
    mystery: 'A power supply keeps failing. Something is drawing too much current...',
    topics: ['resistor', 'capacitor', 'inductor', 'diode', 'voltage'] },
  { id: 'lab', name: 'The Laboratory', desc: 'Semiconductors: transistors, MOSFETs, BJTs, op-amps', tier: 'micro', difficulty: 2,
    mystery: 'A signal amplifier produces a distorted output. The transistor circuit needs debugging...',
    topics: ['transistor', 'mosfet', 'bjt', 'op-amp'] },
  { id: 'foundry', name: 'The Foundry', desc: 'Manufacturing: PCBs, soldering, 3D printing, CNC', tier: 'quick', difficulty: 3,
    mystery: 'A production line produces boards that fail intermittently. The fault lies somewhere in the fabrication...',
    topics: ['pcb', 'soldering', 'smd', '3d-printing', 'cnc'] },
  { id: 'nexus', name: 'The Signal Nexus', desc: 'Protocols: I2C, SPI, CAN bus, PWM', tier: 'quick', difficulty: 4,
    mystery: 'Devices on the network are sending corrupted data. Something is wrong with the bus configuration...',
    topics: ['i2c', 'spi', 'can-bus', 'pwm'] },
  { id: 'sanctum', name: 'The Control Sanctum', desc: 'Embedded: STM32, clocks, ADC, IMU', tier: 'quick', difficulty: 5,
    mystery: 'A microcontroller keeps resetting. The clock source is unstable and peripherals are misbehaving...',
    topics: ['stm32', 'clock', 'adc', 'imu'] },
  { id: 'arena', name: 'The Motion Arena', desc: 'Robotics: PID, kinematics, gait, reinforcement learning', tier: 'small', difficulty: 6,
    mystery: 'A robot walks erratically. Its control loop oscillates and the gait pattern destabilizes...',
    topics: ['pid', 'kinematics', 'gait', 'reinforcement-learning'] },
];

let state = {
  phase: 'loading',
  char: null,
  currentRegion: null,
  masteredTopics: {},
  visitedRegions: [],
  mysteryProgress: {},  // regionId -> { cluesFound: [], solved: bool }
  inventory: [],
  turnCount: 0,
  dbStats: null,
  hintsUsed: 0,
};

// ============================================================
// API
// ============================================================
async function api(endpoint, opts) {
  const res = await fetch(endpoint, opts);
  if (!res.ok) throw new Error(`API ${endpoint}: ${res.status}`);
  return res.json();
}

async function evaluateAnswer(playerAnswer, correctAnswer) {
  try {
    const res = await api('/api/evaluate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ playerAnswer, correctAnswer }),
    });
    return res; // { similarity, grade }
  } catch (e) {
    // Fallback to keyword matching if API fails
    return fallbackEvaluate(playerAnswer, correctAnswer);
  }
}

function fallbackEvaluate(playerAnswer, correctAnswer) {
  const stopWords = new Set(['the','a','an','is','are','was','were','be','been','have','has','had','do','does','did','will','would','could','should','to','of','in','for','on','with','at','by','from','it','this','that','and','or','but','not','so','as','if']);
  const keywords = correctAnswer.toLowerCase().split(/\s+/).map(w => w.replace(/[^a-z0-9]/g, '')).filter(w => w.length > 3 && !stopWords.has(w));
  const unique = [...new Set(keywords)];
  const inputLower = playerAnswer.toLowerCase();
  const matches = unique.filter(kw => inputLower.includes(kw));
  const score = unique.length > 0 ? matches.length / unique.length : 0;
  if (score >= 0.35) return { similarity: 0.85, grade: 'correct' };
  if (score >= 0.15) return { similarity: 0.75, grade: 'partial' };
  return { similarity: 0.5, grade: 'incorrect' };
}

// ============================================================
// DICE
// ============================================================
function d20() { return Math.floor(Math.random() * 20) + 1; }
function dN(n) { return Math.floor(Math.random() * n) + 1; }
function statMod(val) { return Math.floor((val - 10) / 2); }
function rollCheck(statName, dc) {
  const val = state.char.stats[statName] || 10;
  const roll = d20(), mod = statMod(val), total = roll + mod;
  return { roll, mod, total, dc, success: total >= dc, statName };
}
function formatRoll(r) {
  return `<span class="roll-result">[d20: ${r.roll} + ${r.statName} ${r.mod >= 0 ? '+' : ''}${r.mod} = ${r.total} vs DC ${r.dc}] ${r.success ? 'SUCCESS' : 'FAILURE'}</span>`;
}

// ============================================================
// CHARACTER CREATION (preserved from iteration 1)
// ============================================================
function initCharCreation() {
  state.phase = 'creation';
  document.getElementById('loading').style.display = 'none';
  document.getElementById('char-creation').style.display = 'block';

  if (state.dbStats) {
    document.getElementById('db-stats').innerHTML =
      `Knowledge base: ${state.dbStats.documents} topics | ${state.dbStats.essential_terms} terms | ${state.dbStats.quiz_questions} challenges`;
  }

  const grid = document.getElementById('class-grid');
  grid.innerHTML = '';
  let selectedClass = null;

  CLASSES.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'class-btn';
    btn.innerHTML = `${c.name}<br><small style="color:var(--text-dim)">${c.desc}</small>`;
    btn.onclick = () => {
      document.querySelectorAll('.class-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedClass = c;
      checkReady();
    };
    grid.appendChild(btn);
  });

  const statContainer = document.getElementById('stat-rows');
  statContainer.innerHTML = '';
  const statValues = {};
  let pointsLeft = TOTAL_POINTS;
  STAT_NAMES.forEach(s => { statValues[s] = BASE_STAT; });

  function renderStats() {
    statContainer.innerHTML = '';
    STAT_NAMES.forEach(s => {
      const row = document.createElement('div');
      row.className = 'stat-row';
      row.innerHTML = `<span class="stat-name">${s}</span><div class="stat-controls"><button class="stat-btn" data-stat="${s}" data-dir="-1" aria-label="Decrease ${s}">-</button><span class="stat-val">${statValues[s]}</span><button class="stat-btn" data-stat="${s}" data-dir="1" aria-label="Increase ${s}">+</button></div>`;
      statContainer.appendChild(row);
    });
    document.getElementById('stat-points').textContent = `${pointsLeft} points remaining`;
    statContainer.querySelectorAll('.stat-btn').forEach(btn => {
      btn.onclick = () => {
        const stat = btn.dataset.stat, dir = parseInt(btn.dataset.dir);
        if (dir === 1 && pointsLeft > 0 && statValues[stat] < 20) { statValues[stat]++; pointsLeft--; }
        else if (dir === -1 && statValues[stat] > 1) { statValues[stat]--; pointsLeft++; }
        renderStats(); checkReady();
      };
    });
  }
  renderStats();

  const nameInput = document.getElementById('name-input');
  nameInput.oninput = checkReady;

  function checkReady() {
    document.getElementById('start-btn').disabled = !(nameInput.value.trim().length > 0 && selectedClass && pointsLeft === 0);
  }

  document.getElementById('start-btn').onclick = () => {
    const isCaster = selectedClass.resource === 'MP';
    const hp = 20 + statValues.CON * 2, mp = isCaster ? (10 + statValues.INT * 2) : (10 + statValues.STR * 2);
    state.char = {
      name: nameInput.value.trim(), class: selectedClass, stats: { ...statValues },
      hp, maxHp: hp, mp, maxMp: mp, resourceName: selectedClass.resource,
      level: 1, xp: 0, xpToLevel: 100, gold: 50,
      inventory: getStartingItems(selectedClass.id),
    };
    state.phase = 'playing';
    saveState(); startGame();
  };
}

function getStartingItems(classId) {
  const items = {
    engineer: ['Multimeter', 'Wire Strippers', 'Breadboard'],
    explorer: ['Compass', 'Torch', 'Field Notebook'],
    artificer: ['Soldering Iron', 'Component Kit', 'Magnifying Lens'],
    scholar: ['Tome of Circuits', 'Quill & Ink', 'Reading Glasses'],
    tinker: ['Wrench Set', 'Duct Tape', 'Pocket Oscilloscope'],
    sage: ['Teaching Staff', 'Chalk', 'Student Roster'],
  };
  return items[classId] || ['Basic Toolkit'];
}

// ============================================================
// HUD
// ============================================================
function updateHUD() {
  if (!state.char) return;
  const c = state.char;
  document.getElementById('hud').style.display = 'flex';
  document.getElementById('hud-name').textContent = `${c.name} the ${c.class.name}`;
  document.getElementById('hud-level').textContent = `Lv ${c.level}`;
  document.getElementById('hud-hp-bar').style.width = `${(c.hp / c.maxHp) * 100}%`;
  document.getElementById('hud-hp-text').textContent = `${c.hp}/${c.maxHp}`;
  document.getElementById('hud-mp-bar').style.width = `${(c.mp / c.maxMp) * 100}%`;
  document.getElementById('hud-mp-text').textContent = `${c.mp}/${c.maxMp}`;
  document.getElementById('hud-xp-bar').style.width = `${(c.xp / c.xpToLevel) * 100}%`;
  document.getElementById('hud-gold').textContent = `${c.gold}g`;
}

// ============================================================
// NARRATIVE
// ============================================================
function addMsg(text, cls = 'narrator') {
  const div = document.createElement('div');
  div.className = `msg msg-${cls}`;
  div.innerHTML = text;
  document.getElementById('narrative').appendChild(div);
  div.scrollIntoView({ behavior: 'smooth', block: 'end' });
}
function clearNarrative() { document.getElementById('narrative').innerHTML = ''; }

function showChoices(choices, handler) {
  const container = document.getElementById('choice-container');
  container.innerHTML = '';
  choices.forEach((choice, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<span class="key-hint">[${i + 1}]</span> ${choice.text}`;
    if (choice.premium) btn.innerHTML += ' <span class="premium-badge">PRO</span>';
    btn.onclick = () => handler(choice);
    container.appendChild(btn);
  });
  const keyHandler = (e) => {
    const num = parseInt(e.key);
    if (num >= 1 && num <= choices.length) { document.removeEventListener('keydown', keyHandler); handler(choices[num - 1]); }
  };
  document.addEventListener('keydown', keyHandler);
  const freeform = document.getElementById('freeform');
  const submitBtn = document.getElementById('submit-btn');
  freeform.value = '';
  const submitFreeform = () => { const text = freeform.value.trim(); if (text) { document.removeEventListener('keydown', keyHandler); handler({ text, id: 'freeform', freeformInput: text }); } };
  submitBtn.onclick = submitFreeform;
  freeform.onkeydown = (e) => { if (e.key === 'Enter') submitFreeform(); };
}

// ============================================================
// GAME START
// ============================================================
function startGame() {
  document.getElementById('char-creation').style.display = 'none';
  document.getElementById('narrative').style.display = 'block';
  document.getElementById('actions').style.display = 'block';
  updateHUD();

  addMsg(`Welcome, <strong>${state.char.name} the ${state.char.class.name}</strong>.`);
  addMsg(`The Circuit Citadel is in crisis. Systems are failing across every wing. Power supplies surge, signals corrupt, robots stumble. The ancient mechanisms that keep this place running are breaking down — and only someone who truly <em>understands</em> how they work can fix them.`);
  addMsg(`Each region has a mystery to solve. Your knowledge of electronics, engineering, and physics isn't just useful — it's the only thing standing between order and chaos.`, 'system');

  showWorldMap();
}

// ============================================================
// WORLD MAP
// ============================================================
function showWorldMap() {
  addMsg(`<strong>--- Circuit Citadel ---</strong>`, 'system');

  const choices = [];
  REGIONS.forEach(region => {
    const unlocked = region.difficulty <= (state.char.level + 1);
    const visited = state.visitedRegions.includes(region.id);
    const mastery = getRegionMastery(region);
    const mysteryState = state.mysteryProgress[region.id];
    const solved = mysteryState?.solved;
    const masteryStr = mastery > 0 ? ` [${Math.round(mastery * 100)}% mastered]` : '';
    const mysteryStr = solved ? ' [MYSTERY SOLVED]' : (mysteryState?.cluesFound?.length > 0 ? ` [${mysteryState.cluesFound.length} clues found]` : '');

    if (unlocked) {
      addMsg(`<div class="region-card"><h4>${region.name} ${visited ? '' : '(new)'}${masteryStr}${mysteryStr}</h4><p>${region.desc}</p><p style="color:var(--warning); font-size:0.8rem;">${solved ? 'Mystery solved!' : region.mystery}</p></div>`);
      choices.push({ text: `Enter ${region.name}`, id: 'enter_region', region });
    } else {
      addMsg(`<div class="region-card locked"><h4>${region.name} (locked - Level ${region.difficulty - 1} required)</h4><p>${region.desc}</p></div>`);
    }
  });

  choices.push({ text: 'Check character sheet', id: 'char_sheet' });
  choices.push({ text: 'Visit the Knowledge Library (search & review)', id: 'library' });

  showChoices(choices, handleMapChoice);
}

function getRegionMastery(region) {
  let total = 0, mastered = 0;
  for (const t of region.topics) { total++; const m = state.masteredTopics[t]; if (m && m.correct >= 2) mastered++; }
  return total > 0 ? mastered / total : 0;
}

async function handleMapChoice(choice) {
  if (choice.id === 'enter_region') {
    state.currentRegion = choice.region;
    if (!state.visitedRegions.includes(choice.region.id)) state.visitedRegions.push(choice.region.id);
    clearNarrative();
    await enterRegion(choice.region);
  } else if (choice.id === 'char_sheet') {
    showCharSheet(); showWorldMap();
  } else if (choice.id === 'library') {
    await visitLibrary();
  } else if (choice.freeformInput) {
    addMsg(`You consider: "${choice.freeformInput}". Choose a region to explore.`, 'system');
    showWorldMap();
  }
}

function showCharSheet() {
  const c = state.char;
  const masteredCount = Object.keys(state.masteredTopics).filter(k => state.masteredTopics[k].correct >= 2).length;
  addMsg(`<div class="knowledge-reveal"><h4>${c.name} the ${c.class.name} (Level ${c.level})</h4><p>HP: ${c.hp}/${c.maxHp} | ${c.resourceName}: ${c.mp}/${c.maxMp} | Gold: ${c.gold}</p><p>STR: ${c.stats.STR} | DEX: ${c.stats.DEX} | CON: ${c.stats.CON} | INT: ${c.stats.INT} | WIS: ${c.stats.WIS} | CHA: ${c.stats.CHA}</p><p>Inventory: ${c.inventory.join(', ')}</p><p>XP: ${c.xp}/${c.xpToLevel} | Topics mastered: ${masteredCount}</p></div>`);
}

async function visitLibrary() {
  clearNarrative();
  addMsg(`The <strong>Knowledge Library</strong> glows with stored wisdom. The Librarian awaits your query.`);

  showChoices([
    { text: 'Search for a topic (type below)', id: 'search' },
    { text: 'Review weak topics for bonus XP', id: 'review' },
    { text: 'Return to the map', id: 'back' },
  ], async (choice) => {
    if (choice.id === 'search' || choice.freeformInput) {
      const query = choice.freeformInput || '';
      if (query) {
        try {
          const results = await api(`/api/search?q=${encodeURIComponent(query)}`);
          if (results.length > 0) {
            results.slice(0, 5).forEach(r => {
              addMsg(`<div class="knowledge-reveal"><h4>${r.topic} <small>(${r.tier})</small></h4><p>${r.tldr || r.definition || ''}</p></div>`);
            });
          } else { addMsg(`No results for "${query}".`, 'system'); }
        } catch (e) { addMsg('Search failed.', 'system'); }
      }
      await visitLibrary();
    } else if (choice.id === 'review') {
      await spacedRepetitionReview();
    } else {
      clearNarrative(); showWorldMap();
    }
  });
}

async function enterRegion(region) {
  const descriptions = {
    workshop: `The Workshop hums. Copper wires stretch across workbenches, and the acrid smell of burnt components fills the air. The power supply on the main bench keeps tripping — something is wrong with the circuit.`,
    lab: `The Laboratory glows with semiconductor diagrams projected on the walls. An amplifier circuit on the test bench produces a garbled waveform. The signal chain needs debugging.`,
    foundry: `The Foundry thunders with machines. A stack of freshly fabricated PCBs sits on the inspection table — but quality control flags show intermittent failures. The manufacturing process has a hidden flaw.`,
    nexus: `The Signal Nexus pulses with data streams. A network of devices should be communicating flawlessly, but packets drop and signals corrupt. The bus configuration needs diagnosis.`,
    sanctum: `The Control Sanctum's microcontroller altar flickers. The STM32 on the central pedestal keeps resetting, and its peripheral registers show impossible values. Something fundamental is wrong with the clock configuration.`,
    arena: `The Motion Arena echoes with the sound of stumbling robots. A quadruped robot tries to walk but oscillates wildly. Its PID controller needs tuning and its gait pattern is unstable.`,
  };

  addMsg(descriptions[region.id] || `You enter ${region.name}.`);
  addMsg(`<em>${region.mystery}</em>`, 'hint');

  if (!state.mysteryProgress[region.id]) {
    state.mysteryProgress[region.id] = { cluesFound: [], solved: false };
  }

  await generateEncounter(region);
}

async function generateEncounter(region) {
  // Fetch topic data
  const searchTerm = region.topics[Math.floor(Math.random() * region.topics.length)];
  let topicData = null, termData = null, quizData = null;

  try {
    const results = await api(`/api/search?q=${encodeURIComponent(searchTerm)}`);
    if (results.length > 0) { topicData = await api(`/api/topics/${results[0].id}`); }
  } catch (e) {}
  try { termData = await api('/api/terms/random'); } catch (e) {}
  try { quizData = await api('/api/quiz/random'); } catch (e) {}

  // Choose encounter type — weighted toward intrinsic integration
  const types = [];
  if (topicData) types.push('circuit_build', 'diagnosis', 'predict_behavior', 'component_choice');
  if (termData) types.push('negotiate', 'decode');
  if (quizData) types.push('apply_knowledge', 'teach_apprentice');
  if (types.length === 0) types.push('explore');

  const type = types[Math.floor(Math.random() * types.length)];

  switch (type) {
    case 'circuit_build': await circuitBuildEncounter(topicData, region); break;
    case 'diagnosis': await diagnosisEncounter(topicData, region); break;
    case 'predict_behavior': await predictBehaviorEncounter(topicData, region); break;
    case 'component_choice': await componentChoiceEncounter(topicData, region); break;
    case 'negotiate': await negotiateEncounter(termData, region); break;
    case 'decode': await decodeEncounter(termData, region); break;
    case 'apply_knowledge': await applyKnowledgeEncounter(quizData, region); break;
    case 'teach_apprentice': await teachApprenticeEncounter(quizData, region); break;
    default: await exploreEncounter(region);
  }
}

// ENCOUNTER: Circuit Build — player must select the right component
async function circuitBuildEncounter(topic, region) {
  addMsg(`<div class="msg-challenge"><strong>Build Challenge: ${topic.topic}</strong><br>A broken mechanism needs a specific component to function. You must choose the right one based on what you know.</div>`);

  // Get related topics for wrong answers
  let options = [];
  try {
    const similar = await api(`/api/similar/${topic.id}`);
    options = similar.slice(0, 3).map(s => s.topic);
  } catch (e) {}

  // Ensure we have 4 options with the correct answer included
  const correctAnswer = topic.topic;
  options = options.filter(o => o !== correctAnswer);
  while (options.length < 3) { options.push(['Flux Capacitor', 'Quantum Resonator', 'Phase Inverter', 'Chrono Diode'][options.length]); }
  options = options.slice(0, 3);

  // Shuffle correct answer into options
  const allOptions = [...options, correctAnswer].sort(() => Math.random() - 0.5);

  addMsg(`The mechanism's diagnostic display reads: <strong>"${topic.definition || topic.tldr || `Requires: ${topic.topic}`}"</strong>`, 'lore');
  addMsg(`Which component do you install?`);

  // Show component grid
  const choices = allOptions.map(opt => ({ text: opt, id: 'component', value: opt }));
  choices.push({ text: 'Examine the mechanism more carefully (costs 1 turn)', id: 'examine' });

  showChoices(choices, async (choice) => {
    if (choice.id === 'examine') {
      // Give a hint without showing the full answer
      try {
        const links = await api(`/api/links/${topic.id}`);
        if (links.length > 0) {
          addMsg(`You notice connections to: ${links.slice(0, 3).map(l => l.topic).join(', ')}`, 'hint');
        }
      } catch (e) {}
      state.hintsUsed++;
      // Re-present the same choices
      showChoices(choices.filter(c => c.id !== 'examine'), async (c2) => {
        await handleComponentChoice(c2, correctAnswer, topic, region);
      });
    } else {
      await handleComponentChoice(choice, correctAnswer, topic, region);
    }
  });
}

async function handleComponentChoice(choice, correctAnswer, topic, region) {
  if (choice.value === correctAnswer) {
    addMsg(`The ${correctAnswer} clicks into place. The mechanism hums to life!`, 'success');
    trackMastery(topic.topic, true);

    // Track as mystery clue
    const mp = state.mysteryProgress[region.id];
    if (mp && !mp.cluesFound.includes(topic.topic)) {
      mp.cluesFound.push(topic.topic);
      addMsg(`[Clue found: ${topic.topic}]`, 'system');
    }

    grantReward(region.difficulty * 15, region.difficulty * 5);
  } else {
    addMsg(`The ${choice.value} doesn't fit. Sparks fly from the mismatched connection.`, 'combat');
    takeDamage(region.difficulty * 2, 'Electrical feedback!');
    trackMastery(topic.topic, false);

    // NOW reveal the knowledge (after the attempt)
    addMsg(`<div class="knowledge-reveal"><h4>The correct component was: ${correctAnswer}</h4><p>${topic.definition || topic.tldr || ''}</p></div>`);
  }
  await continueOrMap(region);
}

        addMsg(`<div class="knowledge-reveal"><h4>Actual cause</h4><p>${correctAnswer}</p></div>`);

  while (distractors.length < 2) {

  }

  const allOptions = [...distractors, correctOption].sort(() => Math.random() - 0.5);

// ENCOUNTER: Negotiate — must understand terminology to get a good deal
async function negotiateEncounter(term, region) {
  addMsg(`A parts dealer offers a rare component, but speaks entirely in technical jargon.`);
  addMsg(`"I've got a prime specimen here. But first — tell me, what does <strong>${term.term}</strong> mean? I only deal with those who understand what they're buying."`, 'lore');

  showChoices([
    { text: 'Give your definition (type below)', id: 'define' },
    { text: 'Bluff with confidence (CHA check DC 16)', id: 'bluff' },
  ], async (choice) => {

      const input = choice.freeformInput || '';
      if (!input) { addMsg(`You say nothing. The dealer shakes their head.`); await continueOrMap(region); return; }

      if (result.grade === 'correct') {
        addMsg(`The dealer grins. "You know your stuff! Here — fair price."`, 'success');

        addClue(region, quiz.document_topic);
      } else if (result.grade === 'partial') {
        addMsg(`"I think I understand part of it, but I'm still confused about some details."`, 'system');
        trackMastery(quiz.document_topic, false);
        grantReward(region.difficulty * 10, region.difficulty * 4);
        addMsg(`<div class="knowledge-reveal"><h4>A clearer explanation</h4><p>${quiz.answer}</p></div>`);
      } else {
        addMsg(`The apprentice looks more confused than before. Maybe you need to study this topic more yourself.`, 'system');
        trackMastery(quiz.document_topic, false);
        addMsg(`<div class="knowledge-reveal"><h4>The proper explanation</h4><p>${quiz.answer}</p></div>`);
        grantReward(region.difficulty * 2, 0);
      }
    }
    await continueOrMap(region);
  });
}

// ENCOUNTER: Explore — rest/discovery
async function exploreEncounter(region) {
  addMsg(`You explore deeper into ${region.name}. The corridors twist and turn.`);
  const events = [
    { text: 'You find a repair station. Tools and materials are available.', heal: true },
    { text: 'A hidden cache contains salvaged components.', gold: true },
    { text: 'An old diagram on the wall shows a circuit you haven\'t seen before. You study it carefully.', learn: true },
  ];
  const event = events[Math.floor(Math.random() * events.length)];
  addMsg(event.text);

  if (event.heal) {
    const amount = dN(8) + state.char.level * 2;
    state.char.hp = Math.min(state.char.maxHp, state.char.hp + amount);
    addMsg(`You recover ${amount} HP at the repair station.`, 'success');
  } else if (event.gold) {
    const gold = dN(12) + region.difficulty * 3;
    state.char.gold += gold;
    addMsg(`+${gold} gold from salvaged components.`, 'reward');
  } else if (event.learn) {
    try {
      const topic = await api(`/api/topics/random?tier=${region.tier}`);
      if (topic && topic.tldr) {
        addMsg(`<div class="knowledge-reveal"><h4>${topic.topic}</h4><p>${topic.tldr}</p></div>`);
        grantReward(region.difficulty * 5, 0);
      }
    } catch (e) {}
  }

  updateHUD(); saveState();
  await continueOrMap(region);
}

// ============================================================
// MYSTERY SYSTEM
// ============================================================
function addClue(region, topicName) {
  const mp = state.mysteryProgress[region.id];
  if (!mp || mp.solved) return;
  if (!mp.cluesFound.includes(topicName)) {
    mp.cluesFound.push(topicName);
    addMsg(`[Mystery clue ${mp.cluesFound.length}/${region.topics.length}: ${topicName}]`, 'system');

    if (mp.cluesFound.length >= Math.ceil(region.topics.length * 0.6)) {
      mp.solved = true;
      addMsg(`<div class="knowledge-reveal" style="border-color:var(--gold)"><h4>MYSTERY SOLVED: ${region.name}</h4><p>Your understanding of ${mp.cluesFound.join(', ')} has revealed the root cause of the ${region.name}'s problems. The systems begin to stabilize!</p></div>`);
      grantReward(region.difficulty * 50, region.difficulty * 25);
    }
  }
  saveState();
}

// ============================================================
// SPACED REPETITION
// ============================================================
async function spacedRepetitionReview() {
  const candidates = Object.entries(state.masteredTopics)
    .filter(([, v]) => v.correct < 2 && v.attempts > 0)
    .sort((a, b) => a[1].lastSeen - b[1].lastSeen);

  if (candidates.length === 0) {
    addMsg(`No topics need review. Keep exploring!`, 'system');
    await visitLibrary();
    return;
  }

  const [topicKey] = candidates[0];
  try {
    const results = await api(`/api/search?q=${encodeURIComponent(topicKey)}`);
    if (results.length > 0) {
      addMsg(`Review time! You previously struggled with <strong>${results[0].topic}</strong>.`);
      addMsg(`Without looking it up, explain what ${results[0].topic} is and why it matters.`, 'challenge');

      showChoices([{ text: 'Explain (type below)', id: 'explain' }], async (choice) => {
        if (choice.freeformInput) {
          const correctAnswer = results[0].tldr || results[0].definition || results[0].topic;
          const result = await evaluateAnswer(choice.freeformInput, correctAnswer);
          if (result.grade === 'correct') {
            addMsg(`Your understanding has solidified!`, 'success');
            trackMastery(topicKey, true);
            grantReward(15, 5);
          } else {
            addMsg(`Still needs work. Here's a refresher:`);
            trackMastery(topicKey, false);
            addMsg(`<div class="knowledge-reveal"><h4>${results[0].topic}</h4><p>${correctAnswer}</p></div>`);
            grantReward(5, 0);
          }
        }
        await visitLibrary();
      });
      return;
    }
  } catch (e) {}
  addMsg(`Couldn't load review content.`, 'system');
  await visitLibrary();
}

// ============================================================
// REWARDS, DAMAGE, MASTERY
// ============================================================
function grantReward(xp, gold) {
  state.char.xp += xp;
  state.char.gold += gold;
  let msg = `<span class="msg-reward">`;
  if (xp > 0) msg += `+${xp} XP `;
  if (gold > 0) msg += `+${gold} gold `;
  msg += `</span>`;
  addMsg(msg, 'reward');

  while (state.char.xp >= state.char.xpToLevel) {
    state.char.xp -= state.char.xpToLevel;
    state.char.level++;
    state.char.xpToLevel = 100 * state.char.level;
    state.char.maxHp += 5; state.char.hp = state.char.maxHp;
    state.char.maxMp += 3; state.char.mp = state.char.maxMp;
    addMsg(`<strong>LEVEL UP! Level ${state.char.level}!</strong> +5 Max HP, +3 Max ${state.char.resourceName}. New regions may unlock!`, 'success');
  }
  updateHUD(); saveState();
}

function takeDamage(amount, description) {
  state.char.hp = Math.max(0, state.char.hp - amount);
  addMsg(`${description} (-${amount} HP)`, 'combat');
  if (state.char.hp <= 0) {
    state.char.hp = Math.floor(state.char.maxHp * 0.25);
    state.char.gold = Math.max(0, state.char.gold - 10);
    addMsg(`You collapse but are revived at the repair station. (-10 gold)`, 'combat');
  }
  updateHUD(); saveState();
}

function trackMastery(topicName, correct) {
  if (!topicName) return;
  const key = topicName.toLowerCase().replace(/\s+/g, '-');
  if (!state.masteredTopics[key]) state.masteredTopics[key] = { correct: 0, attempts: 0, lastSeen: Date.now() };
  state.masteredTopics[key].attempts++;
  if (correct) state.masteredTopics[key].correct++;
  state.masteredTopics[key].lastSeen = Date.now();
}

async function continueOrMap(region) {
  state.turnCount++;
  const shouldReview = state.turnCount % 6 === 0;
  const mysteryState = state.mysteryProgress[region.id];
  const clueCount = mysteryState?.cluesFound?.length || 0;

  const choices = [
    { text: `Continue investigating ${region.name} (${clueCount} clues found)`, id: 'continue' },
    { text: 'Return to the map', id: 'map' },
  ];
  if (shouldReview) choices.splice(1, 0, { text: 'Review a weak topic (bonus XP)', id: 'review' });

  showChoices(choices, async (choice) => {
    if (choice.id === 'continue') {
      clearNarrative();
      addMsg(`You press deeper into ${region.name}...`);
      await generateEncounter(region);
    } else if (choice.id === 'review') {
      await spacedRepetitionReview();
    } else {
      clearNarrative(); showWorldMap();
    }
  });
}

// ============================================================
// SAVE / LOAD
// ============================================================
function saveState() {
  try {
    localStorage.setItem('knowledge-quest-save', JSON.stringify({
      char: state.char, masteredTopics: state.masteredTopics,
      visitedRegions: state.visitedRegions, turnCount: state.turnCount,
      mysteryProgress: state.mysteryProgress, hintsUsed: state.hintsUsed,
    }));
  } catch (e) {}
}

function loadState() {
  try {
    const saved = localStorage.getItem('knowledge-quest-save');
    if (saved) {
      const data = JSON.parse(saved);
      Object.assign(state, { char: data.char, masteredTopics: data.masteredTopics || {},
        visitedRegions: data.visitedRegions || [], turnCount: data.turnCount || 0,
        mysteryProgress: data.mysteryProgress || {}, hintsUsed: data.hintsUsed || 0 });
      return true;
    }
  } catch (e) {}
  return false;
}

// ============================================================
// PREMIUM
// ============================================================
const premiumFeatures = {
  enabled: false,
  features: {
    advancedClasses: ['Quantum Sage', 'Signal Mage', 'Control Theorist'],
    bonusRegions: ['The Quantum Realm', 'The Electromagnetic Field'],
    cosmetics: ['Golden Circuit Aura', 'Plasma Trail'],
    challengeModes: ['No-Hint Mode', 'Speedrun', 'Master Difficulty'],
  },
};

// ============================================================
// INIT
// ============================================================
async function init() {
  try {
    state.dbStats = await api('/api/stats');
    if (state.dbStats.documents === 0) {
      document.getElementById('loading').innerHTML = '<p>Knowledge base is empty. Run the importer first.</p>';
      return;
    }
    if (loadState()) {
      document.getElementById('loading').style.display = 'none';
      state.phase = 'playing';
      document.getElementById('narrative').style.display = 'block';
      document.getElementById('actions').style.display = 'block';
      updateHUD();
      addMsg(`Welcome back, ${state.char.name}!`, 'system');
      showWorldMap();
    } else {
      initCharCreation();
    }
  } catch (err) {
    document.getElementById('loading').innerHTML = `<p>Could not connect. Is Docker running?</p><p style="color:var(--danger)">${err.message}</p>`;
  }
}

init();
</script>
