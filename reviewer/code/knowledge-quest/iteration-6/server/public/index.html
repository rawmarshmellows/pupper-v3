            if (result.feedback) addMsg(`<em>${result.feedback}</em>`, 'system');
            await trackMastery(quiz.document_topic, true, quiz.level || 2, null);
            addClue(region, quiz.document_topic);
          } else {
            addMsg(`Still not right.`);
            if (result.feedback) addMsg(`<em>${result.feedback}</em>`, 'system');
            trackMastery(quiz.document_topic, false);
            addMsg(`<div class="knowledge-reveal"><h4>Solution</h4><p>${quiz.answer}</p></div>`);
          }
        }
        await continueOrMap(region);
      });
      return;
    }
    await continueOrMap(region);
  });
}

// ENCOUNTER: Teach Apprentice
// ITERATION 6: CHA check for teaching effectiveness
async function teachApprenticeEncounter(quiz, region) {
  addMsg(`An apprentice approaches with a real problem.`, 'lore');
  addMsg(`"I tried to answer this but got confused: <strong>${quiz.question}</strong>"`, 'challenge');

  // ITERATION 6: CHA check
  const chaCheck = rollCheck('CHA', regionDC(region));
  addMsg(`You prepare to teach... ${formatRoll(chaCheck)}`);

  const wrongAttempt = generateWrongAttempt(quiz);
  addMsg(`The apprentice's attempt: <em>"${wrongAttempt}"</em>`);

  if (chaCheck.success) {
    addMsg(`Your charisma puts the apprentice at ease. They are receptive to learning.`, 'system');
  } else {
    addMsg(`The apprentice seems nervous. You will need a clear explanation to get through.`, 'system');
  }

  addMsg(`<strong>What's wrong with their answer? Explain the correct reasoning.</strong>`);

  showChoices([
    { text: 'Correct the apprentice (type your explanation below)', id: 'teach' },
    { text: 'Show the reference material first', id: 'reference' },
  ], async (choice) => {
    if (choice.freeformInput) {
      const result = await evaluateAnswer(choice.freeformInput, quiz.answer, `Correct this wrong answer about ${quiz.document_topic}: "${wrongAttempt}"`);
      // CHA success lowers the bar slightly (broader acceptance of explanation)
      const effectiveGrade = (chaCheck.success && result.grade === 'partial') ? 'correct' : result.grade;

      if (effectiveGrade === 'correct') {
        addMsg(`The apprentice's eyes widen. "Oh! That's where I went wrong. Thank you!"`, 'success');
        addMsg(`Teaching forces you to organize your understanding.`, 'system');
        if (result.feedback) addMsg(`<em>${result.feedback}</em>`, 'system');
        await trackMastery(quiz.document_topic, true, 5, null);
        addClue(region, quiz.document_topic);
        addMsg(`<span class="msg-mastery">Mastery: ${quiz.document_topic} -- teaching mastery achieved.</span>`, 'mastery');
      } else if (result.grade === 'partial') {
        addMsg(`"I think I understand part of it, but your explanation has gaps."`, 'system');
        if (result.feedback) addMsg(`<em>${result.feedback}</em>`, 'system');
        trackMastery(quiz.document_topic, false);
        addMsg(`<div class="knowledge-reveal"><h4>A clearer correction</h4><p>${quiz.answer}</p></div>`);
      } else {
        const misconception = await matchMisconception(choice.freeformInput, quiz.document_topic);
        if (misconception) {
          addMsg(`<div class="msg-misconception"><strong>It seems you share the apprentice's misconception:</strong><br>"${misconception.text}"<br><br><strong>Correction:</strong> ${misconception.correction}</div>`);
        } else if (result.feedback) {
          addMsg(`<em>${result.feedback}</em>`, 'system');
        }
        trackMastery(quiz.document_topic, false);
        addMsg(`<div class="knowledge-reveal"><h4>The proper explanation</h4><p>${quiz.answer}</p></div>`);
      }
    } else if (choice.id === 'reference') {
      state.hintsUsed++;
      addMsg(`<div class="knowledge-reveal"><h4>Reference material</h4><p>${quiz.answer.slice(0, 150)}...</p></div>`);
      addMsg(`Now correct the apprentice's mistake.`);
      showChoices([{ text: 'Teach (type below)', id: 'teach' }], async (c) => {
        if (c.freeformInput) {
          const result = await evaluateAnswer(c.freeformInput, quiz.answer, `Correct: ${quiz.question}`);
          if (result.grade === 'correct') {
            addMsg(`With reference in hand, you give a clear correction.`, 'success');
            if (result.feedback) addMsg(`<em>${result.feedback}</em>`, 'system');
            await trackMastery(quiz.document_topic, true, 4, null);
            addClue(region, quiz.document_topic);
          } else {
            addMsg(`The apprentice still seems confused.`);
            if (result.feedback) addMsg(`<em>${result.feedback}</em>`, 'system');
            trackMastery(quiz.document_topic, false);
            addMsg(`<div class="knowledge-reveal"><h4>Correct explanation</h4><p>${quiz.answer}</p></div>`);
          }
        }
        await continueOrMap(region);
      });
      return;
    }
    await continueOrMap(region);
  });
}

function generateWrongAttempt(quiz) {
  const topic = (quiz.document_topic || '').toLowerCase();
  for (const [key, pool] of Object.entries(MISCONCEPTION_POOLS)) {
    if (topic.includes(key)) {
      return pool[Math.floor(Math.random() * pool.length)].text;
    }
  }
  const answer = quiz.answer || '';
  if (answer.length > 20) {
    const words = answer.split(' ');
    if (words.length > 10) {
      const partial = words.slice(0, Math.floor(words.length * 0.3)).join(' ');
      return `I think it's something like "${partial}..." but then I got confused. Maybe the opposite happens?`;
    }
  }
  return `I know it has something to do with ${quiz.document_topic}, but I'm confusing it with a similar concept.`;
}

// ENCOUNTER: Explore
async function exploreEncounter(region) {
  addMsg(`You explore deeper into ${region.name}.`);
  const events = [
    { text: 'You find a repair station. Tools and materials are available.', heal: true },
    { text: 'An old diagram on the wall shows a circuit you haven\'t seen before.', learn: true },
    { text: 'A hidden alcove contains a journal from a previous engineer.', learn: true },
  ];
  const event = events[Math.floor(Math.random() * events.length)];
  addMsg(event.text);
  if (event.heal) {
    const amount = dN(8) + 4;
    state.char.hp = Math.min(state.char.maxHp, state.char.hp + amount);
    addMsg(`You recover ${amount} HP.`, 'success');
  } else if (event.learn) {
    try {
      const topic = await api(`/api/topics/random?categories=${encodeURIComponent(region.categories[0])}`);
      if (topic && topic.tldr) addMsg(`<div class="knowledge-reveal"><h4>${topic.topic}</h4><p>${topic.tldr}</p></div>`);
    } catch (e) {}
  }
  updateHUD(); saveState();
  await continueOrMap(region);
}

// ============================================================
// MYSTERY SYSTEM
// ============================================================
function addClue(region, topicName) {
  const mp = state.mysteryProgress[region.id];
  if (!mp || mp.solved) return;
  if (!mp.cluesFound.includes(topicName)) {
    mp.cluesFound.push(topicName);
    addMsg(`[Mystery clue ${mp.cluesFound.length}/${region.topics.length}: ${topicName}]`, 'system');
    if (mp.cluesFound.length >= Math.ceil(region.topics.length * 0.6) && !mp.solvable) {
      mp.solvable = true;
      addMsg(`<div class="gate-card"><h4>Mystery Ready to Solve!</h4><p>You've gathered enough clues. Return to the map and enter this region again to attempt the mystery.</p></div>`);
    }
  }
  saveState();
}

async function attemptMysterySolve(region) {
  const mp = state.mysteryProgress[region.id];
  if (!mp || mp.solved || !mp.solvable) return false;

  // ITERATION 6: WIS check for mystery insight
  const wisCheck = rollCheck('WIS', 14);
  addMsg(`You piece together the clues... ${formatRoll(wisCheck)}`);

  addMsg(`<div class="gate-card"><h4>Mystery Challenge: ${region.name}</h4><p>Clues: ${mp.cluesFound.join(', ')}</p><p><em>${region.mystery}</em></p>${wisCheck.success ? `<p style="color:var(--hint)">Your wisdom suggests the root cause involves the interaction between ${mp.cluesFound.slice(0, 2).join(' and ')}.</p>` : ''}<p><strong>Explain the root cause and how to fix it.</strong></p></div>`);

  return new Promise((resolve) => {
    showChoices([
      { text: 'Solve the mystery (type below)', id: 'solve' },
      { text: 'Not yet -- keep investigating', id: 'skip' },
    ], async (choice) => {
      if (choice.freeformInput) {
        const result = await evaluateAnswer(choice.freeformInput, region.mysteryAnswer, `Mystery: ${region.mystery}`);
        if (result.grade === 'correct') {
          mp.solved = true;
          addMsg(`<div class="mastery-card"><h4>MYSTERY SOLVED: ${region.name}</h4><p>Your understanding of ${mp.cluesFound.join(', ')} revealed the root cause.</p><p style="color:var(--text);">${region.mysteryAnswer}</p></div>`);
          addMsg(`<span class="msg-mastery">This is what mastery looks like -- combining knowledge to solve real problems.</span>`, 'mastery');
          if (result.feedback) addMsg(`<em>${result.feedback}</em>`, 'system');
          saveState();
          resolve(true);
        } else if (result.grade === 'partial') {
          addMsg(`On the right track, but the full picture eludes you.`, 'system');
          if (result.feedback) addMsg(`<em>${result.feedback}</em>`, 'system');
          resolve(false);
        } else {
          const misconception = await matchMisconception(choice.freeformInput, region.topics.join(' '));
          if (misconception) {
            addMsg(`<div class="msg-misconception"><strong>Your reasoning contains a misconception:</strong><br>"${misconception.text}"<br><br><strong>Correction:</strong> ${misconception.correction}</div>`);
          } else if (result.feedback) {
            addMsg(`<em>${result.feedback}</em>`, 'system');
          }
          addMsg(`Your explanation doesn't fit the evidence.`, 'system');
          resolve(false);
        }
      } else {
        addMsg(`You decide to gather more knowledge first.`);
        resolve(false);
      }
    });
  });
}

// ============================================================
// CROSS-TOPIC CHALLENGE -- DETERMINISTIC references
// ITERATION 6: INT check for synthesis ability
// ============================================================
async function crossTopicChallenge() {
  clearNarrative();

  const activeRegionIds = REGIONS.filter(r => {
    const mp = state.mysteryProgress[r.id];
    return mp && mp.cluesFound && mp.cluesFound.length >= 2;
  }).map(r => r.id);

  if (activeRegionIds.length < 2) {
    addMsg(`Not enough cross-domain knowledge yet.`, 'system');
    showWorldMap();
    return;
  }

  const available = CROSS_DOMAIN_CHALLENGES.filter(c =>
    c.regions.every(rId => activeRegionIds.includes(rId))
  );
  const allChallenges = available.length > 0 ? available : CROSS_DOMAIN_CHALLENGES;
  const challenge = allChallenges[Math.floor(Math.random() * allChallenges.length)];

  addMsg(`<div class="gate-card"><h4>Cross-Domain Challenge: ${challenge.title}</h4><p>This requires combining knowledge from multiple domains.</p></div>`);

  // ITERATION 6: INT check for synthesis
  const intCheck = rollCheck('INT', 14);
  addMsg(`You attempt to synthesize cross-domain knowledge... ${formatRoll(intCheck)}`);
  if (intCheck.success) {
    addMsg(`Key principles from each domain come into focus, making connections clearer.`, 'hint');
  }

  addMsg(challenge.prompt, 'challenge');

  showChoices([
    { text: 'Provide your cross-domain analysis (type below)', id: 'analyze' },
    { text: 'Not ready -- return to map', id: 'back' },
  ], async (choice) => {
    if (choice.freeformInput) {
      const result = await evaluateAnswer(choice.freeformInput, challenge.reference, challenge.prompt);

      if (result.grade === 'correct') {
        state.crossTopicSolved++;
        addMsg(`Brilliant! Connecting knowledge across domains separates a technician from an engineer.`, 'success');
        if (result.feedback) addMsg(`<em>${result.feedback}</em>`, 'system');
        addMsg(`<span class="msg-mastery">Cross-domain mastery: ${challenge.title}.</span>`, 'mastery');
      } else if (result.grade === 'partial') {
        addMsg(`Making connections, but missing crucial links.`, 'system');
        if (result.feedback) addMsg(`<em>${result.feedback}</em>`, 'system');
        addMsg(`<div class="knowledge-reveal"><h4>Deeper connections</h4><p>${challenge.reference}</p></div>`);
      } else {
        const misconception = await matchMisconception(choice.freeformInput, challenge.title);
        if (misconception) {
          addMsg(`<div class="msg-misconception"><strong>Misconception detected:</strong><br>"${misconception.text}"<br><br><strong>Correction:</strong> ${misconception.correction}</div>`);
        } else if (result.feedback) {
          addMsg(`<em>${result.feedback}</em>`, 'system');
        }
        addMsg(`<div class="knowledge-reveal"><h4>How they connect</h4><p>${challenge.reference}</p></div>`);
      }
    }
    clearNarrative();
    showWorldMap();
  });
}

// ============================================================
// SPACED REPETITION
// ============================================================
async function spacedRepetitionReview() {
  // Prioritize fading topics first
  const fading = getFadingTopics();
  const candidates = fading.length > 0 ? fading : Object.entries(state.masteredTopics)
    .filter(([, v]) => v.correct < 2 && v.attempts > 0)
    .sort((a, b) => a[1].lastReviewed - b[1].lastReviewed);

  if (candidates.length === 0) {
    addMsg(`No topics need review. Keep exploring!`, 'system');
    await visitLibrary();
    return;
  }

  const [topicKey, entry] = candidates[0];
  try {
    const results = await api(`/api/search?q=${encodeURIComponent(topicKey)}`);
    if (results.length > 0) {
      const strength = entry ? Math.round(getMasteryStrength(entry) * 100) : 0;
      addMsg(`Review time! <strong>${results[0].topic}</strong> is at ${strength}% strength.`);
      addMsg(`Without looking it up, explain what ${results[0].topic} is and why it matters.`, 'challenge');
      showChoices([{ text: 'Explain (type below)', id: 'explain' }], async (choice) => {
        if (choice.freeformInput) {
          const correctAnswer = results[0].tldr || results[0].definition || results[0].topic;
          const result = await evaluateAnswer(choice.freeformInput, correctAnswer, `Explain ${results[0].topic}`);
          if (result.grade === 'correct') {
            addMsg(`Your understanding has solidified!`, 'success');
            if (result.feedback) addMsg(`<em>${result.feedback}</em>`, 'system');
            // Update half-life on success
            if (entry) {
              entry.halfLife = (entry.halfLife || HALF_LIFE_INITIAL_MS) * 2;
              entry.lastReviewed = Date.now();
              entry.correct++;
            } else {
              await trackMastery(topicKey, true, 2, null);
            }
            addMsg(`<span class="msg-mastery">Review complete: ${results[0].topic} strengthened.</span>`, 'mastery');
          } else {
            addMsg(`Still needs work. Here's a refresher:`);
            if (result.feedback) addMsg(`<em>${result.feedback}</em>`, 'system');
            if (entry) {
              entry.halfLife = Math.max(HALF_LIFE_INITIAL_MS / 4, (entry.halfLife || HALF_LIFE_INITIAL_MS) / 2);
              entry.lastReviewed = Date.now();
            } else {
              trackMastery(topicKey, false);
            }
            addMsg(`<div class="knowledge-reveal"><h4>${results[0].topic}</h4><p>${correctAnswer}</p></div>`);
          }
        }
        saveState(); updateHUD();
        await visitLibrary();
      });
      return;
    }
  } catch (e) {}
  addMsg(`Couldn't load review content.`, 'system');
  await visitLibrary();
}

// ============================================================
// DAMAGE & MASTERY
// ITERATION 6: Half-life decay model for mastery tracking
// ============================================================
function takeDamage(amount, description) {
  state.char.hp = Math.max(0, state.char.hp - amount);
  addMsg(`${description} (-${amount} HP)`, 'combat');
  if (state.char.hp <= 0) {
    state.char.hp = Math.floor(state.char.maxHp * 0.25);
    addMsg(`You collapse but are revived at the repair station.`, 'combat');
  }
  updateHUD(); saveState();
}

async function trackMastery(topicName, correct, bloomLevel, topicData) {
  if (!topicName) return;
  const key = topicName.toLowerCase().replace(/\s+/g, '-');
  if (!state.masteredTopics[key]) {
    state.masteredTopics[key] = {
      correct: 0, attempts: 0, bloomMax: 0,
      lastReviewed: Date.now(),
      halfLife: HALF_LIFE_INITIAL_MS,
    };
  }
  const entry = state.masteredTopics[key];
  entry.attempts++;
  entry.lastReviewed = Date.now();

  if (correct) {
    entry.correct++;
    // ITERATION 6: Double half-life on success
    entry.halfLife = (entry.halfLife || HALF_LIFE_INITIAL_MS) * 2;
  } else {
    // ITERATION 6: Halve half-life on failure (min 6 hours)
    entry.halfLife = Math.max(HALF_LIFE_INITIAL_MS / 4, (entry.halfLife || HALF_LIFE_INITIAL_MS) / 2);
  }

  if (bloomLevel && bloomLevel > (entry.bloomMax || 0)) {
    entry.bloomMax = bloomLevel;
  }

  if (correct && entry.correct === 2) {
    const insight = topicData ? (topicData.key_insight || topicData.tldr || topicData.definition || '') : topicName;
    let connections = [];
    if (topicData && topicData.id) {
      try {
        const links = await api(`/api/links/${topicData.id}`);
        connections = links.slice(0, 3).map(l => l.topic);
      } catch (e) {}
    }
    addJournalEntry(topicName, insight, connections);
    addMsg(`<span class="msg-mastery">Journal updated: ${topicName} mastered.</span>`, 'mastery');

    if (state.currentRegion) {
      checkGoldReplenishment(state.currentRegion);
    }

    const cascade = checkConceptCascade(topicName);
    if (cascade) {
      state.conceptCascadesTriggered.push(cascade.pair);
      await triggerConceptCascade(cascade);
    }
  }

  updateHUD(); saveState();
}

async function triggerConceptCascade(cascadeInfo) {
  const { pair, cascade } = cascadeInfo;
  addMsg(`<div class="msg-cascade"><h4>Concept Cascade: ${cascade.name}!</h4><p>${cascade.prompt}</p></div>`);
  showChoices([
    { text: 'Explain the connection (type below)', id: 'explain' },
  ], async (choice) => {
    if (choice.freeformInput) {
      const result = await evaluateAnswer(choice.freeformInput, cascade.answer, cascade.prompt);
      if (result.grade === 'correct') {
        addMsg(`The pieces click together! You see how ${pair.replace('+', ' and ')} form a deeper principle.`, 'success');
        if (result.feedback) addMsg(`<em>${result.feedback}</em>`, 'system');
        addMsg(`<span class="msg-mastery">Cascade mastered: ${cascade.name}.</span>`, 'mastery');
        addJournalEntry(cascade.name, cascade.answer.slice(0, 150), pair.split('+'));
      } else {
        addMsg(`You sense the connection but can't quite articulate it yet.`);
        if (result.feedback) addMsg(`<em>${result.feedback}</em>`, 'system');
        addMsg(`<div class="knowledge-reveal"><h4>${cascade.name}</h4><p>${cascade.answer}</p></div>`);
      }
    }
  });
}

async function continueOrMap(region) {
  state.turnCount++;
  const shouldReview = state.turnCount % 6 === 0;
  const mysteryState = state.mysteryProgress[region.id];
  const clueCount = mysteryState?.cluesFound?.length || 0;
  const fadingCount = getFadingTopics().length;

  const choices = [
    { text: `Continue investigating ${region.name} (${clueCount} clues)`, id: 'continue' },
  ];
  if (mysteryState?.solvable && !mysteryState?.solved) {
    choices.push({ text: `Attempt to solve ${region.name}'s mystery!`, id: 'solve_mystery' });
  }
  if (shouldReview || fadingCount > 0) choices.push({ text: `Review a fading topic (${fadingCount} fading)`, id: 'review' });
  choices.push({ text: 'Return to the map', id: 'map' });

  showChoices(choices, async (choice) => {
    if (choice.id === 'continue') {
      clearNarrative();
      addMsg(`You press deeper into ${region.name}...`);
      await generateEncounter(region);
    } else if (choice.id === 'solve_mystery') {
      clearNarrative();
      const solved = await attemptMysterySolve(region);
      if (!solved) await continueOrMap(region);
      else { clearNarrative(); showWorldMap(); }
    } else if (choice.id === 'review') {
      await spacedRepetitionReview();
    } else {
      clearNarrative(); showWorldMap();
    }
  });
}

// ============================================================
// SAVE / LOAD
// ============================================================
function saveState() {
  try {
    localStorage.setItem('knowledge-quest-save', JSON.stringify({
      char: state.char, masteredTopics: state.masteredTopics,
      visitedRegions: state.visitedRegions, turnCount: state.turnCount,
      mysteryProgress: state.mysteryProgress, hintsUsed: state.hintsUsed,
      crossTopicSolved: state.crossTopicSolved || 0,
      conceptCascadesTriggered: state.conceptCascadesTriggered || [],
      knowledgeJournal: state.knowledgeJournal || [],
      goldRanksEarned: state.goldRanksEarned || {},
      tutorialComplete: state.tutorialComplete || false,
    }));
  } catch (e) {}
}

function loadState() {
  try {
    const saved = localStorage.getItem('knowledge-quest-save');
    if (saved) {
      const data = JSON.parse(saved);
      Object.assign(state, {
        char: data.char, masteredTopics: data.masteredTopics || {},
        visitedRegions: data.visitedRegions || [], turnCount: data.turnCount || 0,
        mysteryProgress: data.mysteryProgress || {}, hintsUsed: data.hintsUsed || 0,
        crossTopicSolved: data.crossTopicSolved || 0,
        conceptCascadesTriggered: data.conceptCascadesTriggered || [],
        knowledgeJournal: data.knowledgeJournal || [],
        goldRanksEarned: data.goldRanksEarned || {},
        tutorialComplete: data.tutorialComplete || false,
      });
      // Migrate old mastery entries that lack halfLife
      Object.values(state.masteredTopics).forEach(entry => {
        if (!entry.halfLife) entry.halfLife = HALF_LIFE_INITIAL_MS;
        if (!entry.lastReviewed) entry.lastReviewed = entry.lastSeen || Date.now();
      });
      return true;
    }
  } catch (e) {}
  return false;
}
