<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Knowledge Quest</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d1117;
    --bg-panel: #161b22;
    --bg-card: #1c2333;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --accent-glow: rgba(88,166,255,0.15);
    --success: #3fb950;
    --warning: #d29922;
    --danger: #f85149;
    --streak-bar: #f0883e;
    --mastery: #a371f7;
    --combo: #f778ba;
    --achievement: #d4a72c;
    --node-off: #30363d;
    --node-on: #3fb950;
    --node-fading: #f85149;
    --trace-off: #21262d;
    --trace-on: #58a6ff;
    --power-glow: rgba(63,185,80,0.3);
    --current-flow: #58a6ff;
    --resonance: #f778ba;
    --radius: 8px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --border: #30363d;
    --font-scale: 1;
  }

  [data-fontsize="small"] { --font-scale: 0.875; }
  [data-fontsize="medium"] { --font-scale: 1; }
  [data-fontsize="large"] { --font-scale: 1.15; }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #ffffff; --bg-panel: #f6f8fa; --bg-card: #f0f2f5;
      --text: #1f2328; --text-dim: #59636e; --accent: #0969da;
      --accent-glow: rgba(9,105,218,0.1); --success: #1a7f37;
      --warning: #9a6700; --danger: #cf222e;
      --streak-bar: #bc4c00; --mastery: #8250df; --combo: #bf3989;
      --achievement: #9a6700; --border: #d0d7de;
      --node-off: #d0d7de; --node-on: #1a7f37; --node-fading: #cf222e;
      --trace-off: #eaeef2; --trace-on: #0969da;
      --power-glow: rgba(26,127,55,0.2);
      --current-flow: #0969da; --resonance: #bf3989;
    }
  }
  [data-theme="light"] {
    --bg: #ffffff; --bg-panel: #f6f8fa; --bg-card: #f0f2f5;
    --text: #1f2328; --text-dim: #59636e; --accent: #0969da;
    --accent-glow: rgba(9,105,218,0.1); --success: #1a7f37;
    --warning: #9a6700; --danger: #cf222e;
    --streak-bar: #bc4c00; --mastery: #8250df; --combo: #bf3989;
    --achievement: #9a6700; --border: #d0d7de;
    --node-off: #d0d7de; --node-on: #1a7f37; --node-fading: #cf222e;
    --trace-off: #eaeef2; --trace-on: #0969da;
    --power-glow: rgba(26,127,55,0.2);
    --current-flow: #0969da; --resonance: #bf3989;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  html { font-size: calc(16px * var(--font-scale)); }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; line-height: 1.6; }

  /* HUD */
  #hud {
    display: none; position: sticky; top: 0; z-index: 100;
    background: var(--bg-panel); border-bottom: 1px solid var(--border);
    padding: calc(4px + var(--safe-top)) 12px 4px;
    font-size: 0.8rem;
  }
  .hud-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: space-between; }
  .hud-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: 1; min-width: 0; }
  .hud-right { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  #hud-name { font-weight: 700; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
  .hud-stat { display: flex; align-items: center; gap: 3px; white-space: nowrap; }
  .hud-bar { width: 50px; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; position: relative; }
  .hud-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
  .hud-bar-fill.current-flow { background: linear-gradient(90deg, var(--current-flow), var(--accent)); }
  #hud-streak-text { font-size: 0.7rem; color: var(--text-dim); }
  #hud-title { color: var(--mastery); font-weight: 600; font-size: 0.75rem; }
  #hud-resonance { display: none; color: var(--resonance); font-weight: 700; font-size: 0.85rem; animation: resonancePulse 0.5s ease; }
  @keyframes resonancePulse { 0% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  #hud-power { color: var(--success); font-weight: 700; font-size: 0.8rem; }
  .hud-btn { background: transparent; border: 1px solid var(--border); color: var(--text-dim); border-radius: 4px; padding: 2px 6px; font-size: 0.75rem; cursor: pointer; min-width: 28px; min-height: 28px; display: flex; align-items: center; justify-content: center; }
  .hud-btn:hover, .hud-btn:focus { color: var(--accent); border-color: var(--accent); }

  /* Current flow animation on streak bar */
  @keyframes currentFlowAnim {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }
  .hud-bar-fill.current-flow.flowing {
    background: linear-gradient(90deg, var(--current-flow), var(--accent), var(--current-flow), var(--accent));
    background-size: 200% 100%;
    animation: currentFlowAnim 1.5s linear infinite;
  }

  /* Main Content */
  main { flex: 1; display: flex; flex-direction: column; max-width: 640px; width: 100%; margin: 0 auto; padding: 0 12px; }
  #loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; text-align: center; gap: 12px; }
  #loading h1 { font-size: 1.5rem; color: var(--accent); }
  #loading p { color: var(--text-dim); font-size: 0.9rem; }

  /* Character Creation */
  #char-creation { display: none; padding: 24px 0; }
  #char-creation h2 { color: var(--accent); margin-bottom: 8px; text-align: center; }
  #char-creation p { color: var(--text-dim); text-align: center; margin-bottom: 16px; font-size: 0.9rem; }
  .creation-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .creation-card label { display: block; color: var(--text-dim); font-size: 0.85rem; margin-bottom: 6px; }
  #name-input { width: 100%; padding: 10px 12px; font-size: 1rem; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); }
  #name-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  #db-stats { text-align: center; color: var(--text-dim); font-size: 0.8rem; margin-top: 8px; }
  #start-btn { width: 100%; padding: 12px; font-size: 1.1rem; font-weight: 700; background: var(--accent); color: #fff; border: none; border-radius: var(--radius); cursor: pointer; margin-top: 16px; }
  #start-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #start-btn:not(:disabled):hover { filter: brightness(1.1); }

  /* Narrative */
  #narrative { display: none; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 0 80px; }
  .msg { padding: 8px 12px; margin-bottom: 8px; border-radius: var(--radius); line-height: 1.6; animation: fadeIn 0.2s ease; font-size: 0.95rem; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .msg-narrator { color: var(--text); }
  .msg-system { color: var(--text-dim); font-size: 0.85rem; }
  .msg-challenge { background: var(--bg-card); border-left: 3px solid var(--accent); padding: 12px; }
  .msg-success { color: var(--success); font-weight: 600; }
  .msg-combat { color: var(--danger); }
  .msg-hint { color: var(--warning); font-style: italic; font-size: 0.9rem; }
  .msg-lore { color: var(--text); background: var(--bg-card); border-left: 3px solid var(--mastery); padding: 10px 12px; }
  .msg-mastery { color: var(--mastery); font-weight: 600; }
  .msg-reward { color: var(--achievement); font-weight: 600; }
  .msg-evaluating { color: var(--text-dim); font-style: italic; }
  .msg-cascade { background: var(--bg-card); border-left: 3px solid var(--warning); padding: 12px; }
  .msg-misconception { background: var(--bg-card); border-left: 3px solid var(--danger); padding: 12px; font-size: 0.9rem; }
  .msg-tutorial { background: var(--bg-card); border-left: 3px solid var(--accent); padding: 12px; }

  /* Circuit board node flash */
  .node-powered { animation: nodePower 1s ease; }
  @keyframes nodePower { 0% { box-shadow: none; } 50% { box-shadow: 0 0 12px var(--node-on); } 100% { box-shadow: none; } }

  /* Achievement / certification banner */
  .achievement-banner { background: linear-gradient(135deg, rgba(212,167,44,0.15), rgba(212,167,44,0.05)); border: 1px solid var(--achievement); border-radius: var(--radius); padding: 12px; margin-bottom: 8px; text-align: center; animation: achievementSlide 0.5s ease; }
  @keyframes achievementSlide { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  .achievement-banner h4 { color: var(--achievement); margin-bottom: 4px; }
  .achievement-banner p { color: var(--text-dim); font-size: 0.85rem; }

  /* Eureka banner */
  .eureka-banner { background: linear-gradient(135deg, rgba(88,166,255,0.15), rgba(163,113,247,0.1)); border: 1px solid var(--accent); border-radius: var(--radius); padding: 14px; margin-bottom: 8px; text-align: center; animation: eurekaFlash 0.8s ease; }
  @keyframes eurekaFlash { 0% { transform: scale(0.95); opacity: 0; box-shadow: none; } 50% { transform: scale(1.02); box-shadow: 0 0 20px var(--accent-glow); } 100% { transform: scale(1); opacity: 1; box-shadow: none; } }
  .eureka-banner h4 { color: var(--accent); margin-bottom: 4px; font-size: 1rem; }
  .eureka-banner .eureka-trace { color: var(--mastery); font-size: 0.85rem; margin-top: 4px; }

  /* Progress bar */
  .progress-bar { width: 100%; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .progress-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
  .progress-bar-fill.mastery { background: var(--mastery); }
  .progress-bar-fill.power { background: var(--success); }

  /* NPC */
  .npc-name { color: var(--warning); font-weight: 600; }

  /* Knowledge reveal */
  .knowledge-reveal { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin: 6px 0; }
  .knowledge-reveal h4 { color: var(--accent); margin-bottom: 4px; font-size: 0.95rem; }
  .knowledge-reveal p { font-size: 0.9rem; color: var(--text-dim); }

  /* Mastery card */
  .mastery-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin: 6px 0; }
  .mastery-card h4 { color: var(--accent); margin-bottom: 6px; }

  /* Circuit board mini-map */
  .circuit-board { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin: 6px 0; overflow-x: auto; }
  .circuit-board h4 { color: var(--accent); margin-bottom: 8px; font-size: 0.95rem; }
  .circuit-nodes { display: flex; flex-wrap: wrap; gap: 6px; }
  .circuit-node { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; border: 1px solid var(--border); cursor: pointer; transition: all 0.3s ease; user-select: none; }
  .circuit-node:hover { border-color: var(--accent); box-shadow: 0 0 6px var(--accent-glow); }
  .circuit-node:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .circuit-node.powered { background: var(--power-glow); border-color: var(--node-on); color: var(--node-on); }
  .circuit-node.fading { background: rgba(248,81,73,0.1); border-color: var(--node-fading); color: var(--node-fading); animation: flicker 2s infinite; }
  @keyframes flicker { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  .circuit-node.dark { background: transparent; border-color: var(--node-off); color: var(--text-dim); }
  .circuit-node .node-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .circuit-node.powered .node-dot { background: var(--node-on); box-shadow: 0 0 4px var(--node-on); }
  .circuit-node.fading .node-dot { background: var(--node-fading); }
  .circuit-node.dark .node-dot { background: var(--node-off); }

  /* Node detail popup */
  .node-detail { background: var(--bg-panel); border: 1px solid var(--accent); border-radius: var(--radius); padding: 10px; margin: 4px 0; font-size: 0.85rem; animation: fadeIn 0.2s ease; }
  .node-detail h4 { color: var(--accent); font-size: 0.9rem; margin-bottom: 4px; }
  .node-detail .node-stat { color: var(--text-dim); font-size: 0.8rem; }

  /* Subsystem cards */
  .subsystem-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin: 6px 0; transition: border-color 0.2s, box-shadow 0.3s; }
  .subsystem-card:hover { border-color: var(--accent); }
  .subsystem-card.powered-up { border-color: var(--node-on); box-shadow: 0 0 8px var(--power-glow); }
  .subsystem-card h4 { color: var(--accent); font-size: 0.95rem; margin-bottom: 4px; }
  .subsystem-card p { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 2px; }
  .subsystem-card.locked { opacity: 0.6; }
  .subsystem-status { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .subsystem-status .power-indicator { width: 8px; height: 8px; border-radius: 50%; }
  .subsystem-status .power-indicator.on { background: var(--node-on); box-shadow: 0 0 6px var(--node-on); }
  .subsystem-status .power-indicator.partial { background: var(--warning); }
  .subsystem-status .power-indicator.off { background: var(--node-off); }

  /* Signal degrading alert */
  .signal-alert { background: rgba(248,81,73,0.08); border: 1px solid var(--danger); border-radius: var(--radius); padding: 10px 12px; margin: 6px 0; animation: flicker 2s infinite; }
  .signal-alert h4 { color: var(--danger); font-size: 0.9rem; margin-bottom: 4px; }
  .signal-alert p { font-size: 0.85rem; color: var(--text-dim); }

  /* Journal */
  .journal-entry { background: var(--bg-card); border-left: 3px solid var(--accent); border-radius: 0 var(--radius) var(--radius) 0; padding: 8px 12px; margin: 4px 0; font-size: 0.85rem; }
  .journal-connection { color: var(--mastery); font-size: 0.8rem; }

  /* System log */
  .system-log { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin: 6px 0; max-height: 300px; overflow-y: auto; }
  .system-log h4 { color: var(--accent); margin-bottom: 6px; font-size: 0.9rem; }
  .log-entry { font-size: 0.8rem; padding: 3px 0; border-bottom: 1px solid var(--border); color: var(--text-dim); }
  .log-entry:last-child { border-bottom: none; }
  .log-timestamp { color: var(--text-dim); font-size: 0.7rem; }
  .log-event { color: var(--text); }
  .log-success { color: var(--success); }
  .log-fail { color: var(--danger); }
  .log-discovery { color: var(--accent); }

  /* Actions area */
  #actions { display: none; position: sticky; bottom: 0; background: var(--bg-panel); border-top: 1px solid var(--border); padding: 8px 12px calc(8px + var(--safe-bottom)); }
  #choice-container { display: flex; flex-direction: column; gap: 6px; max-width: 640px; margin: 0 auto; width: 100%; }
  .choice-btn { background: var(--bg-card); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; font-size: 0.9rem; text-align: left; cursor: pointer; min-height: 44px; transition: border-color 0.15s, background 0.15s; }
  .choice-btn:hover, .choice-btn:focus { border-color: var(--accent); background: var(--accent-glow); outline: none; }
  .choice-btn:active { transform: scale(0.98); }
  .key-hint { color: var(--accent); font-weight: 700; margin-right: 4px; font-size: 0.8rem; }
  .premium-badge { background: var(--mastery); color: #fff; font-size: 0.65rem; padding: 1px 4px; border-radius: 3px; vertical-align: middle; }
  #input-row { display: flex; gap: 6px; margin-top: 6px; max-width: 640px; margin-left: auto; margin-right: auto; width: 100%; }
  #freeform { flex: 1; padding: 10px; font-size: 0.9rem; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); min-height: 44px; font-family: inherit; resize: vertical; }
  #freeform:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  #submit-btn { background: var(--accent); color: #fff; border: none; border-radius: var(--radius); padding: 10px 16px; font-weight: 700; cursor: pointer; min-width: 44px; min-height: 44px; }
  #submit-btn:hover { filter: brightness(1.1); }

  /* Footer */
  footer { text-align: center; padding: 8px; font-size: 0.7rem; color: var(--text-dim); border-top: 1px solid var(--border); }

  /* Eval spinner */
  .eval-spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--text-dim); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Tutorial overlay */
  .tutorial-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .tutorial-panel { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; max-width: 500px; width: 100%; max-height: 85vh; overflow-y: auto; }
  .tutorial-panel h2 { color: var(--accent); margin-bottom: 12px; font-size: 1.2rem; }
  .tutorial-panel p { margin-bottom: 8px; font-size: 0.9rem; line-height: 1.6; }
  .tutorial-highlight { background: var(--accent-glow); border: 1px solid var(--accent); border-radius: var(--radius); padding: 10px; margin: 8px 0; font-size: 0.9rem; }
  .tutorial-example { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; margin: 8px 0; font-size: 0.85rem; line-height: 1.6; }
  .tutorial-mechanic-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; margin: 8px 0; }
  .tutorial-mechanic-card h4 { color: var(--accent); font-size: 0.9rem; margin-bottom: 4px; }
  .tutorial-mechanic-card p { font-size: 0.85rem; }
  .tutorial-skip { float: right; background: transparent; border: none; color: var(--text-dim); cursor: pointer; font-size: 0.8rem; padding: 4px 8px; }
  .tutorial-skip:hover { color: var(--accent); }
  .tutorial-step-indicator { color: var(--text-dim); font-size: 0.8rem; margin-bottom: 8px; }
  .tutorial-progress-bar { height: 4px; background: var(--bg); border-radius: 2px; overflow: hidden; margin-bottom: 12px; }
  .tutorial-progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s ease; }
  .tutorial-btn { background: var(--accent); color: #fff; border: none; border-radius: var(--radius); padding: 10px 16px; font-weight: 700; cursor: pointer; font-size: 0.9rem; min-height: 44px; }
  .tutorial-btn:hover { filter: brightness(1.1); }
  .tutorial-btn-secondary { background: var(--bg-card); color: var(--text); border: 1px solid var(--border); }
  .tutorial-btn-secondary:hover { border-color: var(--accent); }
  .tutorial-practice-input { width: 100%; padding: 10px; font-size: 0.9rem; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); margin: 8px 0; font-family: inherit; resize: vertical; }
  .tutorial-practice-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

  /* Help panel overlay */
  .help-panel-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .help-panel { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; max-width: 500px; width: 100%; max-height: 85vh; overflow-y: auto; }
  .help-panel h2 { color: var(--accent); margin-bottom: 12px; }
  .help-panel h3 { color: var(--text); margin-top: 12px; margin-bottom: 4px; font-size: 0.95rem; }
  .help-panel p { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 6px; line-height: 1.5; }
  .help-close { float: right; background: transparent; border: none; color: var(--text-dim); cursor: pointer; font-size: 0.8rem; padding: 4px 8px; }
  .help-close:hover { color: var(--accent); }

  /* Circuit wiring */
  .wiring-ui-container { margin: 8px 0; }
  .wiring-slot { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px; margin: 4px 0; cursor: pointer; font-size: 0.85rem; transition: border-color 0.15s; }
  .wiring-slot:hover { border-color: var(--accent); }
  .wiring-slot.filled { border-color: var(--success); }
  .wiring-slot.selected-slot { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
  .slot-label { color: var(--text-dim); }
  .slot-component { color: var(--text); font-weight: 600; }
  .correct-slot { border-color: var(--success); }
  .wrong-slot { border-color: var(--danger); }
  .wiring-parts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .wiring-part { background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius); padding: 6px 10px; font-size: 0.8rem; cursor: pointer; min-height: 36px; }
  .wiring-part:hover:not(:disabled) { border-color: var(--accent); }

const CONCEPT_CASCADES = {
  'resistor+capacitor': { name: 'RC Time Constants', prompt: 'How do resistors and capacitors interact to create timing circuits? Explain RC time constants.', answer: 'When a resistor and capacitor are in series, they create an RC circuit where the capacitor charges/discharges through the resistor exponentially. The time constant tau = R * C determines how fast this happens. After 5 time constants, the capacitor is ~99% charged. This is fundamental for timing circuits, filters (low-pass RC filter cutoff = 1/(2*pi*R*C)), and smoothing.' },
  'resistor+inductor': { name: 'RL Circuits', prompt: 'How do resistors and inductors work together? What is an RL time constant?', answer: 'In an RL circuit, the inductor opposes changes in current while the resistor dissipates energy. The time constant tau = L/R determines how quickly current reaches steady state. Inductors store energy in magnetic fields, and when current changes, the inductor generates a back-EMF. RL circuits are used in filters, relay coils, and motor drivers.' },

// API
// ============================================================
async function api(endpoint, opts) {
  const res = await fetch(endpoint, opts);
  if (!res.ok) throw new Error(`API ${endpoint}: ${res.status}`);
  return res.json();
}

async function evaluateAnswer(playerAnswer, correctAnswer, question) {
  const evalMsg = addMsg(`<span class="msg-evaluating"><span class="eval-spinner"></span> Evaluating your understanding...</span>`, 'system');
  try {
    const res = await api('/api/evaluate-llm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ playerAnswer, correctAnswer, question: question || '' }),
    });
    if (evalMsg && evalMsg.parentNode) evalMsg.remove();
    return res;
  } catch (e) {
    if (evalMsg && evalMsg.parentNode) evalMsg.remove();
    try {
      const res = await api('/api/evaluate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ playerAnswer, correctAnswer }),
      });
      return { grade: res.grade, feedback: '', misconception: null, source: 'cosine-fallback' };
    } catch (e2) {
      return fallbackEvaluate(playerAnswer, correctAnswer);
    }
  }
}

function fallbackEvaluate(playerAnswer, correctAnswer) {
  const stopWords = new Set(['the','a','an','is','are','was','were','be','been','have','has','had','do','does','did','will','would','could','should','to','of','in','for','on','with','at','by','from','it','this','that','and','or','but','not','so','as','if']);
  const keywords = correctAnswer.toLowerCase().split(/\s+/).map(w => w.replace(/[^a-z0-9]/g, '')).filter(w => w.length > 3 && !stopWords.has(w));
  const unique = [...new Set(keywords)];
  const inputLower = playerAnswer.toLowerCase();
  const matches = unique.filter(kw => inputLower.includes(kw));
  const score = unique.length > 0 ? matches.length / unique.length : 0;
  if (score >= 0.50) return { grade: 'correct', feedback: '', misconception: null, source: 'keyword-fallback' };
  if (score >= 0.25) return { grade: 'partial', feedback: '', misconception: null, source: 'keyword-fallback' };
  return { grade: 'incorrect', feedback: '', misconception: null, source: 'keyword-fallback' };
}

async function matchMisconception(playerAnswer, topicName) {
  const topicLower = (topicName || '').toLowerCase();
  let misconceptions = [];
  for (const [key, pool] of Object.entries(MISCONCEPTION_POOLS)) {
    if (topicLower.includes(key)) misconceptions = misconceptions.concat(pool);
  }
  if (misconceptions.length === 0) return null;
  try {
    const result = await api('/api/misconception-match', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ playerAnswer, misconceptions: misconceptions.map(m => ({ text: m.text, correction: m.correction })) }),
    });
    if (result.matched && result.misconception) return result.misconception;
  } catch (e) {
    for (const m of misconceptions) {
      const mWords = m.text.toLowerCase().split(/\s+/);
      const pWords = playerAnswer.toLowerCase().split(/\s+/);
      const overlap = mWords.filter(w => pWords.includes(w) && w.length > 4).length;
      if (overlap >= 3) return m;
    }
  }
  return null;
}

// CURRENT FLOW (replaces Streaks) + RESONANCE (replaces Combos)
// ============================================================
function onCorrectAnswer() {
  state.currentFlow++;
  state.totalCorrect++;
  state.totalAttempts++;
  if (state.currentFlow > state.bestCurrentFlow) state.bestCurrentFlow = state.currentFlow;

  // Resonance: quick consecutive answers create resonance (LC circuit metaphor)
  state.resonance++;
  if (state.resonanceTimer) clearTimeout(state.resonanceTimer);
  state.resonanceTimer = setTimeout(() => { state.resonance = 0; updateHUD(); }, RESONANCE_WINDOW_MS);

  if (state.resonance >= 2) {
    const resEl = document.getElementById('hud-resonance');
    resEl.style.display = 'inline';
    resEl.textContent = `~${state.resonance}x`;
    resEl.style.animation = 'none';
    resEl.offsetHeight;
    resEl.style.animation = '';
  }

  // Current flow visual feedback
  if (state.currentFlow >= 3) {
    addMsg(`<span class="current-flow-indicator">Current Flow: ${state.currentFlow} -- electrons moving through the board</span>`, 'system');
  }
  if (state.resonance >= 3) {
    addMsg(`<span class="resonance-indicator">Resonance x${state.resonance} -- LC oscillation amplifying learning</span>`, 'system');
  }

  addLogEntry(`Correct answer (flow: ${state.currentFlow}, resonance: x${state.resonance})`, 'success');

  checkCertification('first_node');
  if (state.currentFlow >= 3) checkCertification('current_flow_3');
  if (state.currentFlow >= 5) checkCertification('sustained_current');
  if (state.currentFlow >= 10) checkCertification('superconductor');
  updateHUD();
  saveState();
}

function onIncorrectAnswer() {
  state.currentFlow = 0;
  state.resonance = 0;
  state.totalAttempts++;
  document.getElementById('hud-resonance').style.display = 'none';
  addLogEntry('Incorrect answer -- current interrupted', 'fail');
  updateHUD();
  saveState();
}

function onPartialAnswer() {
  state.totalAttempts++;
  if (state.resonanceTimer) clearTimeout(state.resonanceTimer);
  state.resonanceTimer = setTimeout(() => { state.resonance = 0; updateHUD(); }, RESONANCE_WINDOW_MS);
  addLogEntry('Partial answer -- signal weakened', 'event');
  updateHUD();
  saveState();
}

// CIRCUIT BOARD STATE
// ============================================================
function getBoardPower() {
  let total = 0, powered = 0;
  for (const [, sub] of Object.entries(SUBSYSTEMS)) {
    total += sub.nodes.length;
    powered += sub.nodes.filter(n => isMastered(state.masteredTopics[n])).length;
  }
  return total > 0 ? powered / total : 0;
}

function getSubsystemPower(subsystemName) {
  const sub = SUBSYSTEMS[subsystemName];
  if (!sub) return 0;
  const powered = sub.nodes.filter(n => isMastered(state.masteredTopics[n])).length;
  return powered / sub.nodes.length;
}

function isSubsystemFullyPowered(subsystemName) {
  return getSubsystemPower(subsystemName) >= 1.0;
}

function getSubsystemsFading() {
  const result = [];
  for (const [name, sub] of Object.entries(SUBSYSTEMS)) {
    const fadingNodes = sub.nodes.filter(n => {
      const entry = state.masteredTopics[n];
      return entry && entry.correct >= 2 && getMasteryStrength(entry) < MASTERY_FADING_THRESHOLD;
    });
    if (fadingNodes.length > 0) result.push({ name, fadingNodes });
  }
  return result;
}

// Interactive circuit board with clickable nodes
function renderCircuitBoard() {
  const boardId = 'circuit-board-' + Date.now();
  let html = `<div class="circuit-board" id="${boardId}"><h4>Circuit Board Status</h4>`;
  const boardPower = Math.round(getBoardPower() * 100);
  html += `<div style="font-size:0.85rem; color:var(--text-dim); margin-bottom:6px;">Board Power: ${boardPower}%</div>`;
  html += `<div class="progress-bar"><div class="progress-bar-fill power" style="width:${boardPower}%"></div></div>`;

  for (const [name, sub] of Object.entries(SUBSYSTEMS)) {
    const power = getSubsystemPower(name);
    const isPowered = power >= 1.0;
    html += `<div style="margin-top:8px;"><span style="font-size:0.8rem; color:${isPowered ? 'var(--node-on)' : 'var(--text-dim)'}; font-weight:600;">${name} ${isPowered ? '(ONLINE)' : `(${Math.round(power*100)}%)`}</span></div>`;
    html += '<div class="circuit-nodes">';
    for (const node of sub.nodes) {
      const entry = state.masteredTopics[node];
      const mastered = isMastered(entry);
      const fading = entry && entry.correct >= 2 && getMasteryStrength(entry) < MASTERY_FADING_THRESHOLD;
      const cls = mastered ? 'powered' : (fading ? 'fading' : 'dark');
      html += `<span class="circuit-node ${cls}" tabindex="0" role="button" aria-label="${node} node: ${cls}" data-node="${node}" data-subsystem="${name}"><span class="node-dot"></span>${node}</span>`;
    }
    html += '</div>';
  }

  // Show discovered traces
  if (state.conceptCascadesTriggered.length > 0) {
    html += `<div style="margin-top:10px; font-size:0.8rem; color:var(--trace-on);">Traces: ${state.conceptCascadesTriggered.map(p => {
      const c = CONCEPT_CASCADES[p];
      return c ? c.name : p;
    }).join(', ')}</div>`;
  }

  html += '</div>';
  return { html, boardId };
}

// Click handler for interactive nodes
function attachNodeClickHandlers(boardId) {
  const board = document.getElementById(boardId);
  if (!board) return;
  board.querySelectorAll('.circuit-node').forEach(nodeEl => {
    const handler = () => {
      const nodeName = nodeEl.getAttribute('data-node');
      const subsystemName = nodeEl.getAttribute('data-subsystem');
      // Remove any existing detail popup
      board.querySelectorAll('.node-detail').forEach(d => d.remove());
      const entry = state.masteredTopics[nodeName];
      const strength = entry ? Math.round(getMasteryStrength(entry) * 100) : 0;
      const halfLifeDays = entry ? Math.round((entry.halfLife || HALF_LIFE_INITIAL_MS) / (24*60*60*1000)) : 2;
      const bloomMax = entry ? (entry.bloomMax || 0) : 0;
      const status = isMastered(entry) ? 'Powered' : (entry && entry.correct >= 2 ? 'Fading' : 'Dark');
      const detail = document.createElement('div');
      detail.className = 'node-detail';
      detail.innerHTML = `<h4>${nodeName}</h4>
        <div class="node-stat">Status: <strong>${status}</strong> | Signal: ${strength}%</div>
        <div class="node-stat">Half-life: ${halfLifeDays} day(s) | Bloom level: ${bloomMax || '--'}</div>
        <div class="node-stat">Subsystem: ${subsystemName}</div>
        <div class="node-stat">Correct: ${entry ? entry.correct : 0} | Incorrect: ${entry ? entry.incorrect : 0}</div>`;
      nodeEl.parentNode.insertBefore(detail, nodeEl.nextSibling);
    };
    nodeEl.addEventListener('click', handler);
    nodeEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); handler(); } });
  });
}

function getRegionNPC(region, role) {
  if (!state.regionNPCs[region.id]) state.regionNPCs[region.id] = {};
  if (!state.regionNPCs[region.id][role]) {
    const names = NPC_NAMES[role] || ['Unknown NPC'];
    const idx = Math.abs(hashStr(region.id + role)) % names.length;
    state.regionNPCs[region.id][role] = { name: names[idx], interactions: 0, topicsDiscussed: [], lastTopic: null };
  }
  return state.regionNPCs[region.id][role];
}

function hashStr(s) { let h = 0; for (let i = 0; i < s.length; i++) h = ((h << 5) - h) + s.charCodeAt(i); return h; }

function npcGreeting(npc, role) {
  if (npc.interactions === 0) {
    if (role === 'dealer') return `A merchant steps forward: "<span class="npc-name">${npc.name}</span> here. Need components?"`;
    if (role === 'apprentice') return `A young technician approaches: "<span class="npc-name">${npc.name}</span>. Can you help me understand something?"`;
    if (role === 'engineer') return `A senior engineer turns from their workbench. "<span class="npc-name">${npc.name}</span>. Show me what you know."`;
  } else if (npc.topicsDiscussed.length >= 3) {
    const recent = npc.topicsDiscussed.slice(-3).join(', ');
    if (role === 'dealer') return `<span class="npc-name">${npc.name}</span> waves: "My best customer! ${npc.topicsDiscussed.length} topics discussed."`;
    if (role === 'apprentice') return `<span class="npc-name">${npc.name}</span> rushes over: "You've taught me ${recent} and more! I see connections now."`;
    if (role === 'engineer') return `<span class="npc-name">${npc.name}</span> nods with respect: "You've proven yourself on ${npc.topicsDiscussed.length} topics."`;
  } else {

  }

}

// ============================================================
// HALF-LIFE MASTERY DECAY
// ============================================================
function getMasteryStrength(topicEntry) {
  if (!topicEntry || !topicEntry.lastReviewed) return 0;
  const timeSince = Date.now() - topicEntry.lastReviewed;
  const halfLife = topicEntry.halfLife || HALF_LIFE_INITIAL_MS;
  return Math.pow(2, -timeSince / halfLife);
}

function isMastered(topicEntry) {
  if (!topicEntry) return false;
  return topicEntry.correct >= 2 && getMasteryStrength(topicEntry) >= MASTERY_FADING_THRESHOLD;
}

function getMasteredCount() { return Object.values(state.masteredTopics).filter(v => isMastered(v)).length; }

function getFadingTopics() {
  return Object.entries(state.masteredTopics)
    .filter(([, v]) => v.correct >= 2 && getMasteryStrength(v) < MASTERY_FADING_THRESHOLD)
    .sort((a, b) => getMasteryStrength(a[1]) - getMasteryStrength(b[1]));
}

function getMasteryPercent() { return Math.min(100, Math.round((getMasteredCount() / TOTAL_MASTERY_TOPICS_ESTIMATE) * 100)); }

function getRegionMastery(region) {
  let total = 0, mastered = 0;
  for (const t of region.topics) { total++; if (isMastered(state.masteredTopics[t])) mastered++; }
  return total > 0 ? mastered / total : 0;
}

function getTitle() {
  const pct = getBoardPower();
  let title = TITLES[0];
  for (const t of TITLES) { if (pct >= t.threshold) title = t; }
  return title;
}

function checkConceptCascade(topicName) {
  const masteredKeys = Object.keys(state.masteredTopics).filter(k => isMastered(state.masteredTopics[k]));
  const normalizedTopic = topicName.toLowerCase().replace(/\s+/g, '-');
  for (const [pair, cascade] of Object.entries(CONCEPT_CASCADES)) {
    if (state.conceptCascadesTriggered.includes(pair)) continue;
    const [a, b] = pair.split('+');
    const hasA = masteredKeys.some(k => k === a);
    const hasB = masteredKeys.some(k => k === b);
    const justMasteredOne = (normalizedTopic === a || normalizedTopic === b);
    if (hasA && hasB && justMasteredOne) return { pair, cascade };
  }
  return null;
}

function addJournalEntry(topic, insight, connections) {
  state.knowledgeJournal.push({ topic, insight: insight ? insight.slice(0, 200) : '', connections: connections || [], timestamp: Date.now() });
  if (state.knowledgeJournal.length > 50) state.knowledgeJournal.shift();
}

// ============================================================
// TOPIC MASTERY TRACKING
// ============================================================
async function trackMastery(topicName, correct, bloomLevel, topicData) {
  const key = topicName.toLowerCase().replace(/\s+/g, '-');
  if (!state.masteredTopics[key]) state.masteredTopics[key] = { correct: 0, incorrect: 0, lastReviewed: null, halfLife: HALF_LIFE_INITIAL_MS, bloomMax: 0 };
  const entry = state.masteredTopics[key];

  if (correct) {
    entry.correct++;
    entry.lastReviewed = Date.now();
    entry.halfLife = (entry.halfLife || HALF_LIFE_INITIAL_MS) * 2;
    if (bloomLevel && bloomLevel > (entry.bloomMax || 0)) entry.bloomMax = bloomLevel;
    if (bloomLevel >= 4) checkCertification('bloom_4');

    onCorrectAnswer();
    addLogEntry(`Node powered: ${topicName} (Bloom ${bloomLevel || '?'})`, 'success');

    const masteredCount = getMasteredCount();
    if (masteredCount >= 5) checkCertification('master_5');
    if (masteredCount >= 20) checkCertification('master_20');
    if (masteredCount >= 50) checkCertification('master_50');

    // Check subsystem completion
    for (const [name, sub] of Object.entries(SUBSYSTEMS)) {
      if (isSubsystemFullyPowered(name) && !state.bossesDefeated.includes('sub_' + name)) {
        addMsg(`<div class="eureka-banner"><h4>SUBSYSTEM ONLINE: ${name}!</h4><p>${sub.reward}</p><p class="eureka-trace">All nodes powered. Boss encounter unlocked!</p></div>`);
        checkCertification('subsystem_1');
        addLogEntry(`SUBSYSTEM ONLINE: ${name}`, 'discovery');
      }
    }

    // Check concept cascade
    const cascade = checkConceptCascade(key);
    if (cascade) {
      state.conceptCascadesTriggered.push(cascade.pair);
      checkCertification('cascade_1');
      if (state.conceptCascadesTriggered.length >= 5) checkCertification('cascade_5');
      addMsg(`<div class="eureka-banner"><h4>Trace Connected: ${cascade.cascade.name}!</h4><p>You discovered a connection: ${cascade.cascade.prompt}</p><p class="eureka-trace">${cascade.pair.replace('+', ' -- ')} now linked on your board</p></div>`);
      addJournalEntry(cascade.cascade.name, cascade.cascade.answer.slice(0, 150), cascade.pair.split('+'));
      addLogEntry(`Trace discovered: ${cascade.cascade.name}`, 'discovery');
    }

    if (topicData) {
      const connections = [];
      try { const links = await api(`/api/links/${topicData.id}`); connections.push(...links.slice(0, 3).map(l => l.topic)); } catch (e) {}
      addJournalEntry(topicName, topicData.key_insight || topicData.tldr || '', connections);
    }
  } else {
    entry.incorrect++;
    entry.halfLife = Math.max(HALF_LIFE_INITIAL_MS / 4, (entry.halfLife || HALF_LIFE_INITIAL_MS) / 2);
    onIncorrectAnswer();
    addLogEntry(`Failed: ${topicName}`, 'fail');
  }
  saveState();
  updateHUD();
}

function getInterleavedSearchTerm(region) {
  const topics = region.topics;
  if (!state.lastEncounteredTopic || topics.length <= 1) return topics[Math.floor(Math.random() * topics.length)];
  const remaining = topics.filter(t => t !== state.lastEncounteredTopic);
  return remaining.length > 0 ? remaining[Math.floor(Math.random() * remaining.length)] : topics[Math.floor(Math.random() * topics.length)];
}

function runInteractiveTutorial(stepIndex) {
  const totalSteps = TUTORIAL_STEPS.length;
  if (stepIndex >= totalSteps) { state.tutorialComplete = true; saveState(); const el = document.querySelector('.tutorial-overlay'); if (el) el.remove(); clearNarrative(); startGame(); return; }
  const step = TUTORIAL_STEPS[stepIndex];
  const progressPct = Math.round(((stepIndex + 1) / totalSteps) * 100);
  const existing = document.querySelector('.tutorial-overlay');
  if (existing) existing.remove();
  const overlay = document.createElement('div');
  overlay.className = 'tutorial-overlay';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-label', `Tutorial step ${stepIndex + 1} of ${totalSteps}: ${step.title}`);
  const panel = document.createElement('div');
  panel.className = 'tutorial-panel';
  const skipBtn = document.createElement('button');
  skipBtn.className = 'tutorial-skip';
  skipBtn.textContent = 'Skip Tutorial';
  skipBtn.setAttribute('aria-label', 'Skip tutorial');
  skipBtn.onclick = () => { overlay.remove(); state.tutorialComplete = true; saveState(); clearNarrative(); startGame(); };
  panel.appendChild(skipBtn);
  const indicator = document.createElement('div');
  indicator.className = 'tutorial-step-indicator';
  indicator.textContent = `Step ${stepIndex + 1} of ${totalSteps}`;
  panel.appendChild(indicator);
  const progressBar = document.createElement('div');
  progressBar.className = 'tutorial-progress-bar';
  progressBar.innerHTML = `<div class="tutorial-progress-fill" style="width:${progressPct}%"></div>`;
  panel.appendChild(progressBar);
  const title = document.createElement('h2');
  title.textContent = step.title;
  panel.appendChild(title);
  const content = document.createElement('div');
  content.innerHTML = step.content(state.char);
  panel.appendChild(content);
  if (step.interactive) { buildPracticeEncounter(panel, overlay, stepIndex); }
  else {
    const btnContainer = document.createElement('div');
    btnContainer.style.cssText = 'display:flex; gap:8px; margin-top:16px;';
    if (stepIndex > 0) {
      const backBtn = document.createElement('button');
      backBtn.className = 'tutorial-btn tutorial-btn-secondary';
      backBtn.textContent = 'Back';
      backBtn.style.flex = '1';
      backBtn.onclick = () => { overlay.remove(); runInteractiveTutorial(stepIndex - 1); };
      btnContainer.appendChild(backBtn);
    }
    const nextBtn = document.createElement('button');
    nextBtn.className = 'tutorial-btn';
    nextBtn.textContent = stepIndex === totalSteps - 1 ? 'Start Playing!' : 'Next';
    nextBtn.style.flex = '2';
    nextBtn.onclick = () => { overlay.remove(); runInteractiveTutorial(stepIndex + 1); };
    btnContainer.appendChild(nextBtn);
    panel.appendChild(btnContainer);
  }
  overlay.appendChild(panel);
  document.body.appendChild(overlay);
  const focusTarget = panel.querySelector('.tutorial-btn:not(.tutorial-btn-secondary)') || panel.querySelector('.tutorial-practice-input');
  if (focusTarget) setTimeout(() => focusTarget.focus(), 100);
}

function buildPracticeEncounter(panel, overlay, stepIndex) {
  const totalSteps = TUTORIAL_STEPS.length;
  const questionBox = document.createElement('div');
  questionBox.className = 'tutorial-highlight';
  questionBox.innerHTML = `<strong>Practice Question:</strong> What is a resistor and what does it do in a circuit?`;
  panel.appendChild(questionBox);
  const instruction = document.createElement('p');
  instruction.innerHTML = `<strong>Type your answer below.</strong> A sentence or two is fine.`;
  instruction.style.fontSize = '0.9rem';
  panel.appendChild(instruction);
  const input = document.createElement('textarea');
  input.className = 'tutorial-practice-input';
  input.placeholder = 'Type your answer here...';
  input.rows = 2;
  input.setAttribute('aria-label', 'Type your practice answer here');
  panel.appendChild(input);
  const btnContainer = document.createElement('div');
  btnContainer.style.cssText = 'display:flex; gap:8px; margin-top:8px;';
  const backBtn = document.createElement('button');
  backBtn.className = 'tutorial-btn tutorial-btn-secondary';
  backBtn.textContent = 'Back';
  backBtn.style.flex = '1';
  backBtn.onclick = () => { overlay.remove(); runInteractiveTutorial(stepIndex - 1); };
  btnContainer.appendChild(backBtn);
  const checkBtn = document.createElement('button');
  checkBtn.className = 'tutorial-btn';
  checkBtn.textContent = 'Check My Answer';
  checkBtn.style.flex = '2';
  btnContainer.appendChild(checkBtn);
  panel.appendChild(btnContainer);
  const resultArea = document.createElement('div');
  resultArea.style.cssText = 'display:none; margin-top:12px;';
  panel.appendChild(resultArea);
  checkBtn.onclick = async () => {
    const answer = input.value.trim();
    if (!answer) { input.style.borderColor = 'var(--danger)'; input.placeholder = 'Please type something!'; return; }
    checkBtn.disabled = true;
    checkBtn.textContent = 'Evaluating...';
    const correctAnswer = 'A resistor limits current flow in a circuit. It converts electrical energy to heat. Resistance in ohms determines current via Ohm\'s law (V=IR).';
    try {
      const result = await evaluateAnswer(answer, correctAnswer, 'What is a resistor?');
      resultArea.style.display = 'block';
      if (result.grade === 'correct') {
        resultArea.innerHTML = `<div class="tutorial-example"><strong>Node powered!</strong> ${result.feedback || 'You understand the concept.'}<br><br><em>In the real game, this would light up the resistor node on your circuit board.</em></div>`;
      } else if (result.grade === 'partial') {
        resultArea.innerHTML = `<div class="tutorial-highlight"><strong>Partial signal.</strong> ${result.feedback || 'You got part of it.'}<br><br><strong>Full answer:</strong> A resistor limits current, converting energy to heat via Ohm's law (V=IR).<br><em>Partial answers still advance you!</em></div>`;
      } else {
        resultArea.innerHTML = `<div class="tutorial-highlight" style="border-color:var(--danger);"><strong>Node stays dark.</strong> ${result.feedback || ''}<br><br><strong>Answer:</strong> A resistor limits current, converting energy to heat via Ohm's law (V=IR).<br><em>Wrong answers always show the correct explanation.</em></div>`;
      }
    } catch (e) {
      resultArea.style.display = 'block';
      resultArea.innerHTML = `<div class="tutorial-example"><strong>Evaluation unavailable</strong> -- reference: A resistor limits current via Ohm's law (V=IR).</div>`;
    }
    const continueBtn = document.createElement('button');
    continueBtn.className = 'tutorial-btn';
    continueBtn.textContent = stepIndex === totalSteps - 1 ? 'Start Playing!' : 'Continue';
    continueBtn.style.marginTop = '8px';
    continueBtn.onclick = () => { overlay.remove(); runInteractiveTutorial(stepIndex + 1); };
    resultArea.appendChild(continueBtn);
    continueBtn.focus();
  };
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); checkBtn.click(); } });
}

  container.innerHTML = '';

    const btn = document.createElement('button');

    container.appendChild(btn);

  const keyHandler = (e) => {
    const num = parseInt(e.key);
    if (num >= 1 && num <= choices.length) { document.removeEventListener('keydown', keyHandler); handler(choices[num - 1]); }
  };
  document.addEventListener('keydown', keyHandler);
  const freeform = document.getElementById('freeform');
  const submitBtn = document.getElementById('submit-btn');
  freeform.value = '';
  const submitFreeform = () => { const text = freeform.value.trim(); if (text) { document.removeEventListener('keydown', keyHandler); handler({ text, id: 'freeform', freeformInput: text }); } };
  submitBtn.onclick = submitFreeform;
  freeform.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitFreeform(); } };
}

// ============================================================
// WORLD MAP
// ============================================================
function showWorldMap() {
  // Show circuit board
  const { html: boardHtml, boardId } = renderCircuitBoard();
  addMsg(boardHtml);
  // Attach interactive click handlers after render
  setTimeout(() => attachNodeClickHandlers(boardId), 50);

  addMsg(`<strong>--- Subsystem Status ---</strong>`, 'system');

  const choices = [];
  REGIONS.forEach(region => {
    const unlocked = isRegionUnlocked(region);
    const visited = state.visitedRegions.includes(region.id);
    const subPower = getSubsystemPower(region.subsystem);
    const fullyPowered = isSubsystemFullyPowered(region.subsystem);
    const mysteryState = state.mysteryProgress[region.id];
    const solved = mysteryState?.solved;
    const mysteryStr = solved ? ' [SOLVED]' : (mysteryState?.cluesFound?.length > 0 ? ` [${mysteryState.cluesFound.length} clues]` : '');
    const powerClass = fullyPowered ? 'powered-up' : '';

    if (unlocked) {
      const powerIndicator = fullyPowered ? '<span class="power-indicator on"></span>' : (subPower > 0 ? '<span class="power-indicator partial"></span>' : '<span class="power-indicator off"></span>');
      addMsg(`<div class="subsystem-card ${powerClass}"><h4>${region.name} ${visited ? '' : '(new)'}${mysteryStr}</h4><p>${region.desc}</p><div class="subsystem-status">${powerIndicator}<span style="font-size:0.8rem; color:var(--text-dim);">${region.subsystem}: ${Math.round(subPower*100)}% powered</span></div><p style="color:var(--warning); font-size:0.8rem;">${solved ? 'Mystery solved!' : region.mystery}</p><div class="progress-bar"><div class="progress-bar-fill power" style="width:${Math.round(subPower*100)}%"></div></div></div>`);
      choices.push({ text: `Enter ${region.name}`, id: 'enter_region', region });
      // Boss encounter option if subsystem fully powered and boss not defeated
      if (fullyPowered && !state.bossesDefeated.includes(region.subsystem)) {
        choices.push({ text: `BOSS: ${SUBSYSTEMS[region.subsystem].bossName}`, id: 'boss', region });
      }
    } else {
      const required = getUnlockRequirement(region);
      addMsg(`<div class="subsystem-card locked"><h4>${region.name} (locked)</h4><p>${region.desc}</p><p style="color:var(--mastery); font-size:0.8rem;">Unlock: ${required}</p></div>`);
    }
  });

  if (!isMaintenanceCompleted()) choices.push({ text: 'Daily Maintenance Round (system check)', id: 'maintenance_round' });

  const fadingCount = getFadingTopics().length;
  if (fadingCount > 0) choices.push({ text: `Repair fading nodes (${fadingCount} degrading)`, id: 'review_fading' });

  const regionsWithClues = REGIONS.filter(r => { const mp = state.mysteryProgress[r.id]; return mp && mp.cluesFound && mp.cluesFound.length >= 2; });
  if (regionsWithClues.length >= 2) choices.push({ text: 'Cross-Domain Synthesis', id: 'cross_topic' });

  choices.push({ text: 'Certifications and system log', id: 'certifications' });
  choices.push({ text: 'Open Knowledge Journal', id: 'journal' });
  choices.push({ text: 'Knowledge Library (search)', id: 'library' });

  showChoices(choices, handleMapChoice);
}

function isRegionUnlocked(region) {
  if (region.difficulty <= 1) return true;
  const prevRegion = REGIONS.find(r => r.difficulty === region.difficulty - 1);
  if (!prevRegion) return true;
  return getRegionMastery(prevRegion) >= 0.4;
}

function getUnlockRequirement(region) {
  const prevRegion = REGIONS.find(r => r.difficulty === region.difficulty - 1);
  if (!prevRegion) return 'Unknown';
  return `Power ${prevRegion.subsystem} to 40% (currently ${Math.round(getSubsystemPower(prevRegion.subsystem) * 100)}%)`;
}

async function handleMapChoice(choice) {
  if (choice.id === 'enter_region') {
    state.currentRegion = choice.region;
    if (!state.visitedRegions.includes(choice.region.id)) {
      state.visitedRegions.push(choice.region.id);
      if (state.visitedRegions.length >= 6) checkCertification('visit_all');
    }
    addLogEntry(`Entered ${choice.region.name}`, 'event');
    clearNarrative();
    await enterRegion(choice.region);
  } else if (choice.id === 'boss') {
    clearNarrative();
    await bossEncounter(choice.region);
  } else if (choice.id === 'certifications') {
    showCertifications();
    showWorldMap();
  } else if (choice.id === 'journal') {
    showKnowledgeJournal();
    showWorldMap();
  } else if (choice.id === 'library') {
    await visitLibrary();
  } else if (choice.id === 'cross_topic') {
    await crossTopicChallenge();
  } else if (choice.id === 'review_fading') {
    await reviewFadingTopic();
  } else if (choice.id === 'maintenance_round') {
    await maintenanceRound();
  } else if (choice.freeformInput) {
    addMsg(`Choose a region to explore.`, 'system');
    showWorldMap();
  }
}

// BOSS ENCOUNTER -- BUG-001 FIX + BUG-003 FIX: Multi-phase with real answers
// ============================================================
async function bossEncounter(region) {
  const sub = SUBSYSTEMS[region.subsystem];
  if (!sub || state.bossesDefeated.includes(region.subsystem)) { clearNarrative(); showWorldMap(); return; }

  const phases = sub.bossPhases;
  const totalPhases = phases.length;
  let currentPhase = 0;
  let correctPhases = 0;

  addLogEntry(`Boss encounter started: ${sub.bossName}`, 'event');

  async function runBossPhase() {
    const phase = phases[currentPhase];
    const hpPercent = Math.round(((totalPhases - correctPhases) / totalPhases) * 100);

    addMsg(`<div class="boss-card"><h4>BOSS: ${sub.bossName}</h4><p class="boss-phase">${phase.prompt}</p><div class="boss-hp"><div class="boss-hp-fill" style="width:${hpPercent}%"></div></div><p style="font-size:0.8rem; color:var(--text-dim); margin-top:4px;">Phase ${currentPhase + 1}/${totalPhases} | HP: ${hpPercent}%</p></div>`);

    showChoices([{ text: 'Provide your analysis (type below)', id: 'answer' }], async (choice) => {
      if (choice.freeformInput) {
        // BUG-001 FIX: Evaluate against phase.answer (real answer), not bossPrompt
        const result = await evaluateAnswer(choice.freeformInput, phase.answer, phase.prompt);

        if (result.grade === 'correct') {
          correctPhases++;
          addMsg(`Phase ${currentPhase + 1} cleared!`, 'success');
          if (result.feedback) addMsg(`<em>${result.feedback}</em>`, 'system');
          onCorrectAnswer();
          for (const t of sub.nodes) await trackMastery(t, true, 5, null);
        } else if (result.grade === 'partial') {
          addMsg(`Phase ${currentPhase + 1}: partial -- you showed understanding but missed key details.`, 'system');
          if (result.feedback) addMsg(`<em>${result.feedback}</em>`, 'system');
          addMsg(`<div class="knowledge-reveal"><h4>Complete answer</h4><p>${phase.answer}</p></div>`);
          onPartialAnswer();
        } else {
          addMsg(`Phase ${currentPhase + 1}: failed.`, 'system');
          if (result.feedback) addMsg(`<em>${result.feedback}</em>`, 'system');
          addMsg(`<div class="knowledge-reveal"><h4>Expected answer</h4><p>${phase.answer}</p></div>`);
          onIncorrectAnswer();
        }

        currentPhase++;
        if (currentPhase < totalPhases) {
          // More phases to go
          showChoices([{ text: `Continue to phase ${currentPhase + 1}`, id: 'next_phase' }], async () => {
            clearNarrative();
            await runBossPhase();
          });
        } else {
          // All phases complete -- evaluate outcome
          if (correctPhases >= totalPhases) {
            state.bossesDefeated.push(region.subsystem);
            checkCertification('boss_1');
            addMsg(`<div class="eureka-banner"><h4>BOSS DEFEATED: ${sub.bossName}</h4><p>${sub.reward}</p><p class="eureka-trace">${region.subsystem} is now fully operational! ${correctPhases}/${totalPhases} phases cleared.</p></div>`);
            addLogEntry(`Boss defeated: ${sub.bossName} (${correctPhases}/${totalPhases})`, 'success');
          } else if (correctPhases >= Math.ceil(totalPhases / 2)) {
            state.bossesDefeated.push(region.subsystem);
            checkCertification('boss_1');
            addMsg(`<div class="eureka-banner"><h4>BOSS DEFEATED: ${sub.bossName}</h4><p>${sub.reward}</p><p class="eureka-trace">Passed with ${correctPhases}/${totalPhases} phases. The subsystem runs, but review the failed phases!</p></div>`);
            addLogEntry(`Boss defeated (partial): ${sub.bossName} (${correctPhases}/${totalPhases})`, 'success');
          } else {
            addMsg(`The boss stands. ${correctPhases}/${totalPhases} phases cleared -- need at least ${Math.ceil(totalPhases / 2)} to win. Review the topics and try again.`, 'system');
            addLogEntry(`Boss failed: ${sub.bossName} (${correctPhases}/${totalPhases})`, 'fail');
          }
          saveState(); updateHUD();
          clearNarrative(); showWorldMap();
        }
      } else {
        clearNarrative(); showWorldMap();
      }
    });
  }

  await runBossPhase();
}

// ============================================================
// MAINTENANCE ROUND (replaces Daily Challenge)
// ============================================================
async function maintenanceRound() {
  clearNarrative();
  addMsg(`<div class="msg-challenge"><strong><span class="daily-badge">MAINT</span> Daily Maintenance Round</strong><br>System check: verify a node's signal integrity. This is how circuits stay reliable.</div>`);

  // Prefer fading topics for maintenance; fallback to random quiz
  const fadingTopics = getFadingTopics();
  if (fadingTopics.length > 0) {
    const [topicKey, entry] = fadingTopics[0];
    const strength = Math.round(getMasteryStrength(entry) * 100);
    addMsg(`<div class="signal-alert"><h4>Maintenance Target: ${topicKey}</h4><p>Signal at ${strength}%. Recharge this node to pass maintenance.</p></div>`);
    try {
      const results = await api(`/api/search?q=${encodeURIComponent(topicKey)}`);
      if (results.length > 0 && results[0].tldr) addMsg(`Diagnostic hint: <em>"${results[0].tldr.slice(0, 80)}..."</em>`, 'hint');
      addMsg(`Explain ${topicKey} to restore signal integrity.`, 'challenge');
      showChoices([{ text: 'Explain (type below)', id: 'explain' }], async (choice) => {
        if (choice.freeformInput) {
          const correctAnswer = results.length > 0 ? (results[0].tldr || results[0].definition || topicKey) : topicKey;
          const result = await evaluateAnswer(choice.freeformInput, correctAnswer, `Maintenance check: ${topicKey}`);
          if (result.grade === 'correct') {
            addMsg(`Maintenance passed! Node signal restored.`, 'success');
            if (result.feedback) addMsg(`<em>${result.feedback}</em>`, 'system');
            entry.halfLife = (entry.halfLife || HALF_LIFE_INITIAL_MS) * 2;
            entry.lastReviewed = Date.now();
            entry.correct++;
            completeMaintenanceRound();
            checkCertification('review_fading');
            onCorrectAnswer();
          } else if (result.grade === 'partial') {
            addMsg(`Partial maintenance. Signal partially restored.`, 'system');
            if (result.feedback) addMsg(`<em>${result.feedback}</em>`, 'system');
            entry.lastReviewed = Date.now();
            completeMaintenanceRound();
            onPartialAnswer();
          } else {
            addMsg(`Maintenance failed. Signal continues degrading.`, 'system');
            if (result.feedback) addMsg(`<em>${result.feedback}</em>`, 'system');
            addMsg(`<div class="knowledge-reveal"><h4>${topicKey}</h4><p>${correctAnswer}</p></div>`);
            onIncorrectAnswer();
          }
        }
        saveState(); updateHUD();
        clearNarrative(); showWorldMap();
      });
    } catch (e) { addMsg('Could not load maintenance data.', 'system'); clearNarrative(); showWorldMap(); }
    return;
  }

  // Fallback: random quiz question
  try {
    const quizData = await api(`/api/quiz/random`);
    if (!quizData) { addMsg('No maintenance targets available.', 'system'); clearNarrative(); showWorldMap(); return; }
    addMsg(`<div class="msg-challenge"><strong>Routine check: ${quizData.document_topic}</strong><br>${quizData.question}</div>`);
    showChoices([{ text: 'Answer (type below)', id: 'answer' }], async (choice) => {
      if (choice.freeformInput) {
        const result = await evaluateAnswer(choice.freeformInput, quizData.answer, quizData.question);
        if (result.grade === 'correct') {
          addMsg(`Maintenance passed!`, 'success');
          if (result.feedback) addMsg(`<em>${result.feedback}</em>`, 'system');
          completeMaintenanceRound();
          await trackMastery(quizData.document_topic, true, quizData.level || 2, quizData);
        } else if (result.grade === 'partial') {
          addMsg(`Partial pass.`, 'system');
          if (result.feedback) addMsg(`<em>${result.feedback}</em>`, 'system');
          completeMaintenanceRound();
          onPartialAnswer();
        } else {
          addMsg(`Maintenance failed.`, 'system');
          if (result.feedback) addMsg(`<em>${result.feedback}</em>`, 'system');
          addMsg(`<div class="knowledge-reveal"><h4>${quizData.document_topic}</h4><p>${quizData.answer}</p></div>`);
          onIncorrectAnswer();
        }
      }
      saveState(); updateHUD();
      clearNarrative(); showWorldMap();
    });
  } catch (e) { addMsg('Could not load maintenance data.', 'system'); clearNarrative(); showWorldMap(); }
}

          entry.halfLife = (entry.halfLife || HALF_LIFE_INITIAL_MS) * 2;
          entry.lastReviewed = Date.now();
          entry.correct++;
          onCorrectAnswer();
          checkCertification('review_fading');

        } else if (result.grade === 'partial') {
          addMsg(`Partial recharge.`, 'system');
          entry.lastReviewed = Date.now();
          onPartialAnswer();
          if (result.feedback) addMsg(`<em>${result.feedback}</em>`, 'system');
          addMsg(`<div class="knowledge-reveal"><h4>${topicKey}</h4><p>${correctAnswer}</p></div>`);

// ============================================================
async function enterRegion(region) {
  const descriptions = {
    workshop: `The Workshop hums. Copper wires stretch across benches, and smoke curls from a burnt component.`,
    lab: `The Lab glows with semiconductor diagrams. An amplifier on the bench produces a garbled waveform.`,
    foundry: `The Foundry thunders. Freshly fabricated PCBs sit on the inspection table.`,
    nexus: `The Signal Nexus pulses. Packets drop and signals corrupt across the network.`,
    sanctum: `The Control Sanctum flickers. The STM32 on the central pedestal keeps resetting.`,
    arena: `The Motion Arena echoes with stumbling robots. A quadruped oscillates wildly.`,
  };
  addMsg(descriptions[region.id] || `You enter ${region.name}.`);
  addMsg(`<em>${region.mystery}</em>`, 'hint');
  if (!state.mysteryProgress[region.id]) state.mysteryProgress[region.id] = { cluesFound: [], solved: false };

  const apprentice = getRegionNPC(region, 'apprentice');
  if (!state.cascadeEncountersSinceLastTrigger[region.id]) state.cascadeEncountersSinceLastTrigger[region.id] = 0;
  state.cascadeEncountersSinceLastTrigger[region.id]++;
  if (apprentice.topicsDiscussed.length >= 5 && state.cascadeEncountersSinceLastTrigger[region.id] >= 4) {
    state.cascadeEncountersSinceLastTrigger[region.id] = 0;
    saveState();
    await npcCascadeTrigger(apprentice, region);
    return;
  }

  if (state.visitedRegions.length <= 1 && state.turnCount === 0) {
    addMsg(`<div class="msg-tutorial">First encounter. Type your answer below to power the node.</div>`);
  }
  await generateEncounter(region);
}

async function npcCascadeTrigger(npc, region) {
  addMsg(npcGreeting(npc, 'apprentice'), 'lore');
  const discussed = npc.topicsDiscussed;
  const shuffled = [...discussed].sort(() => Math.random() - 0.5);
  const topicA = shuffled[0], topicB = shuffled[1];
  const pairKey = `${topicA}+${topicB}`, reversePairKey = `${topicB}+${topicA}`;
  const cascade = CONCEPT_CASCADES[pairKey] || CONCEPT_CASCADES[reversePairKey];

  if (cascade && !state.conceptCascadesTriggered.includes(pairKey) && !state.conceptCascadesTriggered.includes(reversePairKey)) {
    addMsg(`<span class="npc-name">${npc.name}</span>: "You taught me ${topicA} and ${topicB}. How do they connect?"`, 'challenge');
    addMsg(`<div class="msg-cascade"><h4>Trace Discovery: ${cascade.name}</h4><p>${cascade.prompt}</p></div>`);
    showChoices([{ text: 'Explain the connection (type below)', id: 'explain' }], async (choice) => {
      if (choice.freeformInput) {
        const result = await evaluateAnswer(choice.freeformInput, cascade.answer, cascade.prompt);
        if (result.grade === 'correct') {
          addMsg(`${npc.name}: "Now I see it!"`, 'success');
          state.conceptCascadesTriggered.push(pairKey);
          checkCertification('cascade_1');
          if (state.conceptCascadesTriggered.length >= 5) checkCertification('cascade_5');
          addMsg(`<div class="eureka-banner"><h4>Trace Connected: ${cascade.name}</h4><p class="eureka-trace">${topicA} -- ${topicB} now linked!</p></div>`);
          addJournalEntry(cascade.name, cascade.answer.slice(0, 150), [topicA, topicB]);
          updateNPC(npc, cascade.name);
          state.apprenticeTeachCount++;
          if (state.apprenticeTeachCount >= 5) checkCertification('teach_5');
          onCorrectAnswer();
        } else {
          addMsg(`${npc.name}: "I see part of it..."`, 'system');
          if (result.feedback) addMsg(`<em>${result.feedback}</em>`, 'system');
          addMsg(`<div class="knowledge-reveal"><h4>${cascade.name}</h4><p>${cascade.answer}</p></div>`);
          if (result.grade === 'partial') onPartialAnswer(); else onIncorrectAnswer();
        }
      }
      saveState(); updateHUD();
      await continueOrMap(region);
    });
    return;
  }
  addMsg(`<span class="npc-name">${npc.name}</span>: "I've learned ${topicA} and ${topicB}. How do they relate?"`, 'challenge');
  showChoices([{ text: 'Explain (type below)', id: 'explain' }, { text: 'Continue exploring', id: 'skip' }], async (choice) => {
    if (choice.freeformInput) {
      try {
        const results = await api(`/api/search?q=${encodeURIComponent(topicA + ' ' + topicB)}`);
        const correctAnswer = results.length > 0 ? (results[0].key_insight || results[0].tldr || `${topicA} and ${topicB}`) : `${topicA} and ${topicB}`;
        const result = await evaluateAnswer(choice.freeformInput, correctAnswer, `How do ${topicA} and ${topicB} relate?`);
        if (result.grade === 'correct') {
          addMsg(`${npc.name}: "That makes sense!"`, 'success');
          updateNPC(npc, `${topicA}+${topicB}`);
          state.apprenticeTeachCount++;
          if (state.apprenticeTeachCount >= 5) checkCertification('teach_5');
          onCorrectAnswer();
        } else {
          if (result.feedback) addMsg(`<em>${result.feedback}</em>`, 'system');
          if (result.grade === 'partial') onPartialAnswer(); else onIncorrectAnswer();
        }
      } catch (e) {}
    }
    saveState(); updateHUD();
    await generateEncounter(region);
  });
}

async function generateEncounter(region) {
  state.turnCount++;
  const cats = region.categories.join(',');
  const searchTerm = getInterleavedSearchTerm(region);
  let topicData = null, termData = null, quizData = null;
  try {
    const results = await api(`/api/search?q=${encodeURIComponent(searchTerm)}&categories=${encodeURIComponent(cats)}`);
    if (results.length > 0) topicData = await api(`/api/topics/${results[0].id}`);
    if (!topicData) { const fb = await api(`/api/search?q=${encodeURIComponent(searchTerm)}`); if (fb.length > 0) topicData = await api(`/api/topics/${fb[0].id}`); }
  } catch (e) {}

  // BUG-002 FIX: Filter prerequisites to same-category topics only
  if (topicData && topicData.id) {
    try {
      const prereqs = await api(`/api/topics/${topicData.id}/prerequisites?depth=2`);
      if (prereqs.length > 0) {
        const regionCats = region.categories;
        const unmasteredPrereq = prereqs.find(p => {
          const key = p.topic.toLowerCase().replace(/\s+/g, '-');
          return !isMastered(state.masteredTopics[key]) && regionCats.includes(p.category);
        });
        if (unmasteredPrereq) {
          addMsg(`<div class="msg-tutorial"><strong>Prerequisite:</strong> Power up <em>${unmasteredPrereq.topic}</em> before tackling <em>${topicData.topic}</em>.</div>`);
          topicData = await api(`/api/topics/${unmasteredPrereq.id}`);
        }
      }
    } catch (e) {}
  }

  const quizSources = REGION_QUIZ_SOURCES[region.difficulty] || '';
  try { termData = await api(`/api/terms/random?categories=${encodeURIComponent(cats)}`); } catch (e) {}
  try {
    const quizUrl = `/api/quiz/random?categories=${encodeURIComponent(cats)}${quizSources ? '&sources=' + encodeURIComponent(quizSources) : ''}`;
    quizData = await api(quizUrl);
  } catch (e) { try { quizData = await api(`/api/quiz/random?categories=${encodeURIComponent(cats)}`); } catch (e2) {} }

  state.lastEncounteredTopic = searchTerm;

  const fadingTopics = getFadingTopics();
  if (fadingTopics.length > 0 && Math.random() < 0.3) {
    await reviewEncounterInRegion(fadingTopics[0], region);
    return;
  }

  const types = [];
  if (topicData) types.push('diagnosis', 'predict_behavior', 'component_choice');
  if (termData) types.push('negotiate', 'decode');
  if (quizData) types.push('apply_knowledge', 'teach_apprentice');
  types.push('circuit_wiring', 'fault_tree');
  if (types.length === 0) types.push('explore');
  const type = types[Math.floor(Math.random() * types.length)];

  switch (type) {
    case 'diagnosis': await diagnosisEncounter(topicData, region); break;
    case 'predict_behavior': await predictBehaviorEncounter(topicData, region); break;
    case 'component_choice': await componentChoiceEncounter(topicData, region); break;
    case 'negotiate': await negotiateEncounter(termData, region); break;
    case 'decode': await decodeEncounter(termData, region); break;
    case 'apply_knowledge': await applyKnowledgeEncounter(quizData, region); break;
    case 'teach_apprentice': await teachApprenticeEncounter(quizData, region); break;
    case 'circuit_wiring': await circuitWiringEncounter(region); break;
    case 'fault_tree': await faultTreeEncounter(region); break;
    default: await exploreEncounter(region);
  }
}

function generateTopicSymptom(topic) {
  const c = (topic.key_insight || topic.definition || topic.tldr || '').toLowerCase();
  if (c.includes('capacit')) return `Output voltage shows excessive ripple.`;
  if (c.includes('resist') && (c.includes('ohm') || c.includes('current'))) return `Current exceeds expected values. Components overheat.`;
  if (c.includes('induct')) return `Large voltage spikes on switching.`;
  if (c.includes('diode') || c.includes('rectif')) return `Circuit only works with one polarity.`;
  if (c.includes('transistor') || c.includes('amplif')) return `Output signal is clipped at both rails.`;
  if (c.includes('clock') || c.includes('oscillat')) return `System timing is erratic.`;
  if (c.includes('bus') || c.includes('protocol')) return `Data transfers return corrupted values.`;
  if (c.includes('solder') || c.includes('pcb')) return `Board passes bench testing but fails in field.`;
  if (c.includes('pid') || c.includes('control')) return `System overshoots its target.`;
  if (c.includes('sensor') || c.includes('adc')) return `Readings are noisy and drift.`;
  return `The ${topic.topic} subsystem behaves unexpectedly.`;
}

async function circuitWiringEncounter(region) {
  const regionCat = region.categories[0];
  let candidates = CIRCUIT_WIRING_CHALLENGES.filter(c => c.category === regionCat);
  if (candidates.length === 0) candidates = CIRCUIT_WIRING_CHALLENGES;
  const challenge = candidates[Math.floor(Math.random() * candidates.length)];
  addMsg(`<div class="msg-challenge"><strong>Build Subsystem Component</strong><br>Goal: <em>${challenge.goal}</em></div>`);
  const allParts = [...challenge.correctOrder, ...challenge.distractors].sort(() => Math.random() - 0.5);
  const slotFills = new Array(challenge.slots.length).fill(null);
  let usedParts = new Set();
  let selectedSlotIdx = null;

  function renderWiringUI() {
    document.querySelectorAll('.wiring-ui-container').forEach(el => el.remove());
    const container = document.createElement('div');
    container.className = 'wiring-ui-container';
    const instr = document.createElement('p');
    instr.style.cssText = 'font-size:0.85rem; color:var(--text-dim); margin-bottom:6px;';
    instr.textContent = selectedSlotIdx !== null ? `Slot ${selectedSlotIdx + 1} selected -- tap a part.` : 'Tap a slot, then a part.';
    container.appendChild(instr);
    const slotsDiv = document.createElement('div');
    slotsDiv.setAttribute('aria-label', 'Circuit slots');
    challenge.slots.forEach((slotName, i) => {
      const slot = document.createElement('div');
      slot.className = 'wiring-slot' + (slotFills[i] ? ' filled' : '') + (selectedSlotIdx === i ? ' selected-slot' : '');
      slot.innerHTML = `<span class="slot-label">${i+1}. ${slotName}:</span> <span class="slot-component">${slotFills[i] || '(empty)'}</span>`;
      slot.setAttribute('aria-label', `Slot ${i+1}: ${slotName}`);
      slot.onclick = () => { if (slotFills[i]) { usedParts.delete(slotFills[i]); slotFills[i] = null; selectedSlotIdx = i; } else { selectedSlotIdx = i; } renderWiringUI(); };
      slotsDiv.appendChild(slot);
    });
    container.appendChild(slotsDiv);
    const partsDiv = document.createElement('div');
    partsDiv.className = 'wiring-parts';
    allParts.forEach(part => {
      const btn = document.createElement('button');
      btn.className = 'wiring-part' + (usedParts.has(part) ? ' used' : '');
      btn.textContent = part;
      btn.disabled = usedParts.has(part);
      btn.onclick = () => {
        if (usedParts.has(part)) return;
        let idx = selectedSlotIdx;
        if (idx === null || slotFills[idx] !== null) idx = slotFills.indexOf(null);
        if (idx >= 0 && idx < slotFills.length) { slotFills[idx] = part; usedParts.add(part); selectedSlotIdx = slotFills.indexOf(null); renderWiringUI(); }
      };
      partsDiv.appendChild(btn);
    });
    container.appendChild(partsDiv);
    document.getElementById('narrative').appendChild(container);
    container.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }
  renderWiringUI();
  showChoices([{ text: 'Submit build', id: 'submit_wiring' }, { text: 'Clear all', id: 'clear_wiring' }], async function wiringHandler(choice) {
    if (choice.id === 'clear_wiring') { slotFills.fill(null); usedParts.clear(); selectedSlotIdx = null; renderWiringUI(); showChoices([{ text: 'Submit build', id: 'submit_wiring' }, { text: 'Clear all', id: 'clear_wiring' }], wiringHandler); return; }
    let correctCount = 0;
    document.querySelectorAll('.wiring-ui-container').forEach(el => el.remove());
    for (let i = 0; i < challenge.slots.length; i++) {
      const isCorrect = slotFills[i] === challenge.correctOrder[i];
      if (isCorrect) correctCount++;
      addMsg(`<div class="wiring-slot ${isCorrect ? 'correct-slot' : 'wrong-slot'}"><span class="slot-label">${challenge.slots[i]}:</span> <span class="slot-component">${slotFills[i] || '(empty)'} -- ${isCorrect ? 'Correct' : 'Wrong'}</span>${!isCorrect ? `<br><small style="color:var(--text-dim)">Needed: ${challenge.correctOrder[i]}</small>` : ''}</div>`);
    }
    if (correctCount === challenge.slots.length) {
      addMsg(`All connections correct! Component built successfully.`, 'success');
      checkCertification('circuit_wiring');
      for (const topic of region.topics) await trackMastery(topic, true, 3, null);
      addClue(region, 'circuit-wiring');
    } else if (correctCount >= challenge.slots.length / 2) {
      addMsg(`${correctCount}/${challenge.slots.length} correct. Almost.`, 'system');
      onPartialAnswer();
    } else {
      addMsg(`Only ${correctCount}/${challenge.slots.length}. Build fails.`, 'combat');
      onIncorrectAnswer();
    }
    addMsg(`<div class="knowledge-reveal"><h4>How It Works</h4><p>${challenge.explanation}</p></div>`);
    await continueOrMap(region);
  });
}

async function faultTreeEncounter(region) {
  const regionCat = region.categories[0];
  let candidates = FAULT_TREE_CHALLENGES.filter(c => c.category === regionCat);
  if (candidates.length === 0) candidates = FAULT_TREE_CHALLENGES;
  const challenge = candidates[Math.floor(Math.random() * candidates.length)];
  addMsg(`<div class="msg-challenge"><strong>Fault Diagnosis: ${challenge.title}</strong><br>${challenge.symptoms}</div>`);
  const usedSteps = new Set();
  let stepsUsed = 0;
  function showDiagnosticSteps() {
    const container = document.getElementById('choice-container');
    container.innerHTML = '';
    challenge.steps.forEach((step, i) => {
      const btn = document.createElement('button');
      btn.className = 'fault-step-btn' + (usedSteps.has(i) ? ' used-step' : '');
      btn.innerHTML = `${usedSteps.has(i) ? 'Done: ' : ''}${step.action}`;
      btn.setAttribute('aria-label', `${step.action}`);
      btn.disabled = usedSteps.has(i);
      btn.onclick = () => {
        if (usedSteps.has(i)) return;
        usedSteps.add(i); stepsUsed++;
        const resultText = step.eliminates ? `<span style="color:var(--success)">Ruled out: ${step.eliminates}</span>` : `<span style="color:var(--warning)">Clue: ${step.reveals}</span>`;
        addMsg(`<div class="fault-info"><div class="fault-label">${step.action}</div><div class="fault-data">${step.result}<br>${resultText}</div></div>`);
        if (step.reveals && step.reveals.includes('ROOT CAUSE')) { addMsg(`Root cause found!`, 'success'); finalizeFaultTree(true); return; }
        showDiagnosticSteps();
      };
      container.appendChild(btn);
    });
    if (stepsUsed >= challenge.minStepsToSolve) {
      const diagnoseBtn = document.createElement('button');
      diagnoseBtn.className = 'choice-btn';
      diagnoseBtn.innerHTML = `<span class="key-hint">[D]</span> Declare root cause`;
      diagnoseBtn.onclick = () => {
        addMsg(`State your diagnosis.`, 'challenge');
        showChoices([{ text: 'Diagnose (type below)', id: 'diagnose' }], async (choice) => {
          if (choice.freeformInput) {
            const result = await evaluateAnswer(choice.freeformInput, challenge.rootCause, challenge.title);
            if (result.grade === 'correct') finalizeFaultTree(true);
            else { if (result.feedback) addMsg(`<em>${result.feedback}</em>`, 'system'); finalizeFaultTree(false); }
          } else showDiagnosticSteps();
        });
      };
      container.appendChild(diagnoseBtn);
    }
    const giveUpBtn = document.createElement('button');
    giveUpBtn.className = 'choice-btn';
    giveUpBtn.innerHTML = `<span class="key-hint">[X]</span> Give up`;
    giveUpBtn.onclick = () => finalizeFaultTree(false);
    container.appendChild(giveUpBtn);
    document.getElementById('input-row').style.display = 'none';
  }
  async function finalizeFaultTree(solved) {
    document.getElementById('input-row').style.display = 'flex';
    if (solved) {
      addMsg(`<div class="mastery-card"><h4>Fault Diagnosed!</h4><p>${challenge.rootCause}</p></div>`);
      checkCertification('fault_tree');
      for (const topic of region.topics) await trackMastery(topic, true, 4, null);
      addClue(region, 'fault-tree');
    } else {
      addMsg(`<div class="knowledge-reveal"><h4>Root Cause</h4><p>${challenge.rootCause}</p></div>`);
      onIncorrectAnswer();
    }
    await continueOrMap(region);
  }
  showDiagnosticSteps();
}
