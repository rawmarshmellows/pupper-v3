async function circuitWiringEncounter(region) {
  const regionCat = region.categories[0];
  let candidates = CIRCUIT_WIRING_CHALLENGES.filter(c => c.category === regionCat);
  if (candidates.length === 0) candidates = CIRCUIT_WIRING_CHALLENGES;
  const challenge = candidates[Math.floor(Math.random() * candidates.length)];

  addMsg(`<div class="msg-challenge"><strong>Circuit Wiring Challenge</strong><br>Goal: <em>${challenge.goal}</em></div>`);

  const allParts = [...challenge.correctOrder, ...challenge.distractors].sort(() => Math.random() - 0.5);
  const slotFills = new Array(challenge.slots.length).fill(null);
  let usedParts = new Set();
  let selectedSlotIdx = null;

  function renderWiringUI() {
    document.querySelectorAll('.wiring-ui-container').forEach(el => el.remove());
    const container = document.createElement('div');
    container.className = 'wiring-ui-container';
    const instr = document.createElement('p');
    instr.style.cssText = 'font-size:0.85rem; color:var(--text-dim); margin-bottom:6px;';
    instr.textContent = selectedSlotIdx !== null ? `Slot ${selectedSlotIdx + 1} selected -- tap a part to fill it.` : 'Tap a slot to select it, then tap a part to fill it.';
    container.appendChild(instr);
    const slotsDiv = document.createElement('div');
    slotsDiv.setAttribute('aria-label', 'Circuit slots');
    challenge.slots.forEach((slotName, i) => {
      const slot = document.createElement('div');
      const isSelected = selectedSlotIdx === i;
      slot.className = 'wiring-slot' + (slotFills[i] ? ' filled' : '') + (isSelected ? ' selected-slot' : '');
      slot.innerHTML = `<span class="slot-label">${i + 1}. ${slotName}:</span> <span class="slot-component">${slotFills[i] || '(empty -- tap to select)'}</span>`;
      slot.setAttribute('aria-label', `Slot ${i + 1}: ${slotName}, ${slotFills[i] || 'empty'}${isSelected ? ', selected' : ''}`);
      slot.onclick = () => { if (slotFills[i]) { usedParts.delete(slotFills[i]); slotFills[i] = null; selectedSlotIdx = i; } else { selectedSlotIdx = i; } renderWiringUI(); };
      slotsDiv.appendChild(slot);
    });
    container.appendChild(slotsDiv);
    const partsDiv = document.createElement('div');
    partsDiv.className = 'wiring-parts';
    partsDiv.setAttribute('aria-label', 'Available components');
    allParts.forEach(part => {
      const btn = document.createElement('button');
      btn.className = 'wiring-part' + (usedParts.has(part) ? ' used' : '');
      btn.textContent = part;
      btn.setAttribute('aria-label', `Component: ${part}${usedParts.has(part) ? ' (already placed)' : ''}`);
      btn.disabled = usedParts.has(part);
      btn.onclick = () => {
        if (usedParts.has(part)) return;
        let targetIdx = selectedSlotIdx;
        if (targetIdx === null || slotFills[targetIdx] !== null) targetIdx = slotFills.indexOf(null);
        if (targetIdx >= 0 && targetIdx < slotFills.length) { slotFills[targetIdx] = part; usedParts.add(part); selectedSlotIdx = slotFills.indexOf(null); renderWiringUI(); }
      };
      partsDiv.appendChild(btn);
    });
    container.appendChild(partsDiv);
    document.getElementById('narrative').appendChild(container);
    container.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }

  renderWiringUI();

  showChoices([
    { text: 'Submit wiring', id: 'submit_wiring' },
    { text: 'Clear all slots', id: 'clear_wiring' },
  ], async function wiringHandler(choice) {
    if (choice.id === 'clear_wiring') {
      slotFills.fill(null); usedParts.clear(); selectedSlotIdx = null;
      renderWiringUI();
      showChoices([{ text: 'Submit wiring', id: 'submit_wiring' }, { text: 'Clear all slots', id: 'clear_wiring' }], wiringHandler);
      return;
    }
    let correctCount = 0;
    document.querySelectorAll('.wiring-ui-container').forEach(el => el.remove());
    for (let i = 0; i < challenge.slots.length; i++) {
      const isCorrect = slotFills[i] === challenge.correctOrder[i];
      if (isCorrect) correctCount++;
      const icon = isCorrect ? 'Correct' : 'Wrong';
      const cls = isCorrect ? 'correct-slot' : 'wrong-slot';
      addMsg(`<div class="wiring-slot ${cls}"><span class="slot-label">${challenge.slots[i]}:</span> <span class="slot-component">${slotFills[i] || '(empty)'} -- ${icon}</span>${!isCorrect ? `<br><small style="color:var(--text-dim)">Needed: ${challenge.correctOrder[i]}</small>` : ''}</div>`);
    }
    if (correctCount === challenge.slots.length) {
      addMsg(`All connections correct! The circuit powers up perfectly.`, 'success');
      addMsg(`<span class="msg-mastery">Circuit Wiring mastery -- you built it through understanding.</span>`, 'mastery');
      checkAchievement('circuit_wiring');
      for (const topic of region.topics) await trackMastery(topic, true, 3, null);
      addClue(region, 'circuit-wiring-' + challenge.category);
    } else if (correctCount >= challenge.slots.length / 2) {
      addMsg(`${correctCount} of ${challenge.slots.length} correct. Close, but the circuit does not function.`, 'system');
      onPartialAnswer();
    } else {
      addMsg(`Only ${correctCount} of ${challenge.slots.length} correct. The circuit fails.`, 'combat');
      onIncorrectAnswer();
    }
    addMsg(`<div class="knowledge-reveal"><h4>How This Circuit Works</h4><p>${challenge.explanation}</p></div>`);
    await continueOrMap(region);
  });
}

async function faultTreeEncounter(region) {
  const regionCat = region.categories[0];
  let candidates = FAULT_TREE_CHALLENGES.filter(c => c.category === regionCat);
  if (candidates.length === 0) candidates = FAULT_TREE_CHALLENGES;
  const challenge = candidates[Math.floor(Math.random() * candidates.length)];

  addMsg(`<div class="msg-challenge"><strong>Fault Diagnosis: ${challenge.title}</strong><br>${challenge.symptoms}</div>`);
  addMsg(`Choose diagnostic steps to narrow down the root cause.`);

  const usedSteps = new Set();
  let stepsUsed = 0;

  function showDiagnosticSteps() {
    const container = document.getElementById('choice-container');
    container.innerHTML = '';
    challenge.steps.forEach((step, i) => {
      const btn = document.createElement('button');
      btn.className = 'fault-step-btn' + (usedSteps.has(i) ? ' used-step' : '');
      btn.innerHTML = `${usedSteps.has(i) ? 'Done: ' : ''}${step.action}`;
      btn.setAttribute('aria-label', `Diagnostic step: ${step.action}${usedSteps.has(i) ? ' (already performed)' : ''}`);
      btn.disabled = usedSteps.has(i);
      btn.onclick = () => {
        if (usedSteps.has(i)) return;
        usedSteps.add(i); stepsUsed++;
        const resultText = step.eliminates
          ? `<span style="color:var(--success)">Ruled out: ${step.eliminates}</span>`
          : `<span style="color:var(--warning)">Clue: ${step.reveals}</span>`;
        addMsg(`<div class="fault-info"><div class="fault-label">${step.action}</div><div class="fault-data">${step.result}<br>${resultText}</div></div>`);
        if (step.reveals && step.reveals.includes('ROOT CAUSE')) {
          addMsg(`You have identified the root cause!`, 'success');
          finalizeFaultTree(true); return;
        }
        showDiagnosticSteps();
      };
      container.appendChild(btn);
    });
    if (stepsUsed >= challenge.minStepsToSolve) {
      const diagnoseBtn = document.createElement('button');
      diagnoseBtn.className = 'choice-btn';
      diagnoseBtn.innerHTML = `<span class="key-hint">[D]</span> Declare root cause`;
      diagnoseBtn.setAttribute('aria-label', 'Declare root cause');
      diagnoseBtn.onclick = () => {
        addMsg(`Based on your investigation, what is the root cause?`, 'challenge');
        showChoices([{ text: 'State your diagnosis (type below)', id: 'diagnose' }], async (choice) => {
          if (choice.freeformInput) {
            const result = await evaluateAnswer(choice.freeformInput, challenge.rootCause, `Diagnose: ${challenge.title}`);
            if (result.grade === 'correct') { finalizeFaultTree(true); }
            else if (result.grade === 'partial') {
              addMsg(`Close but missing a key detail.`, 'system');
              if (result.feedback) addMsg(`<em>${result.feedback}</em>`, 'system');
              finalizeFaultTree(false);
            } else {
              const misconception = await matchMisconception(choice.freeformInput, challenge.category);
              if (misconception) addMsg(`<div class="msg-misconception"><strong>Common misconception:</strong> "${misconception.text}"<br><br><strong>Correction:</strong> ${misconception.correction}</div>`);
              if (result.feedback) addMsg(`<em>${result.feedback}</em>`, 'system');
              finalizeFaultTree(false);
            }
          } else showDiagnosticSteps();
        });
      };
      container.appendChild(diagnoseBtn);
    }
    const giveUpBtn = document.createElement('button');
    giveUpBtn.className = 'choice-btn';
    giveUpBtn.innerHTML = `<span class="key-hint">[X]</span> Give up and see the answer`;
    giveUpBtn.setAttribute('aria-label', 'Give up');
    giveUpBtn.onclick = () => finalizeFaultTree(false);
    container.appendChild(giveUpBtn);
    document.getElementById('input-row').style.display = 'none';
  }

  async function finalizeFaultTree(solved) {
    document.getElementById('input-row').style.display = 'flex';
    if (solved) {
      addMsg(`<div class="mastery-card"><h4>Fault Diagnosed!</h4><p>${challenge.rootCause}</p><p style="font-size:0.85rem; color:var(--text-dim);">Steps used: ${stepsUsed}/${challenge.steps.length}</p></div>`);
      addMsg(`<span class="msg-mastery">Fault Tree mastery -- systematic diagnosis through reasoning.</span>`, 'mastery');
      checkAchievement('fault_tree');
      for (const topic of region.topics) await trackMastery(topic, true, 4, null);
      addClue(region, 'fault-tree-' + challenge.category);
    } else {
      addMsg(`<div class="knowledge-reveal"><h4>Root Cause</h4><p>${challenge.rootCause}</p></div>`);
      onIncorrectAnswer();
    }
    await continueOrMap(region);
  }

  showDiagnosticSteps();
}

          if (result.grade === 'correct') {

function generateTopicSymptom(topic) {
  const content = (topic.key_insight || topic.definition || topic.tldr || '').toLowerCase();
  if (content.includes('store') && content.includes('capacit')) return `Output voltage shows excessive ripple and fails to maintain steady DC.`;
  if (content.includes('resist') && (content.includes('ohm') || content.includes('current'))) return `Current exceeds expected values. Components downstream are overheating.`;
  if (content.includes('induct') && (content.includes('magnetic') || content.includes('coil'))) return `Large voltage spikes appear when switching.`;
  if (content.includes('diode') || content.includes('rectif')) return `Circuit only works with one polarity.`;
  if (content.includes('transistor') || content.includes('amplif') || content.includes('gain')) return `Output signal is clipped at both rails.`;
  if (content.includes('clock') || content.includes('oscillat')) return `System timing is erratic. Peripherals work intermittently.`;
  if (content.includes('bus') || content.includes('protocol') || content.includes('data')) return `Data transfers return corrupted values.`;
  if (content.includes('solder') || content.includes('pcb')) return `Board passes bench testing but fails in the field.`;
  if (content.includes('pid') || content.includes('control')) return `System overshoots its target repeatedly.`;
  if (content.includes('sensor') || content.includes('adc')) return `Readings are noisy and drift over time.`;
  if (content.length > 30) return `A subsystem relying on ${topic.topic} is failing.`;
  return `The ${topic.topic} subsystem behaves unexpectedly.`;
}

function generateTopicScenario(topic) {
  const content = (topic.key_insight || topic.definition || topic.tldr || '').toLowerCase();
  if (content.includes('capacit')) return `If you double the capacitance in an RC filter, what happens to the cutoff frequency?`;
  if (content.includes('resist')) return `If a resistor is replaced with one of double the value, predict the effect on current and power dissipation.`;
  if (content.includes('induct')) return `What happens to an inductor's stored energy when you suddenly open the circuit?`;
  if (content.includes('transistor') || content.includes('gain')) return `If the base bias resistor is halved, how does the transistor's operating point change?`;
  if (content.includes('pid')) return `If you triple the proportional gain, what happens to the system's step response?`;
  return `Predict what happens to ${topic.topic} if a key parameter changes.`;
}

async function componentChoiceEncounter(topic, region) {
  addMsg(`<div class="msg-challenge"><strong>Component Selection</strong><br>A broken mechanism needs a specific component.</div>`);

  let options = [];
  try { const d = await api(`/api/distractors/${topic.id}?count=3`); options = d.map(x => x.topic); } catch (e) {
    try { const s = await api(`/api/similar/${topic.id}`); options = s.slice(0, 3).map(x => x.topic); } catch (e2) {}
  }

  const correctAnswer = topic.topic;
  options = options.filter(o => o !== correctAnswer);
  while (options.length < 3) options.push(['Flux Capacitor', 'Quantum Resonator', 'Phase Inverter'][options.length]);
  options = options.slice(0, 3);
  const allOptions = [...options, correctAnswer].sort(() => Math.random() - 0.5);

  addMsg(`The display reads: <strong>"${topic.definition || topic.tldr || `Requires: ${topic.topic}`}"</strong>`, 'lore');
  addMsg(`Which component do you install?`);

  const choices = allOptions.map(opt => ({ text: opt, id: 'component', value: opt }));
  showChoices(choices, async (choice) => {
    if (choice.value === correctAnswer) {
      addMsg(`The ${correctAnswer} clicks into place. The mechanism hums to life!`, 'success');
      await trackMastery(topic.topic, true, 3, topic);
      addClue(region, topic.topic);
    } else {
      addMsg(`The ${choice.value} doesn't fit.`, 'system');
      await trackMastery(topic.topic, false, null, topic);
      addMsg(`<div class="knowledge-reveal"><h4>Correct component: ${correctAnswer}</h4><p>${topic.definition || topic.tldr || ''}</p></div>`);
    }
    await continueOrMap(region);
  });
}

// CROSS-TOPIC + MYSTERY SYSTEM
// ============================================================
function addClue(region, clueKey) {
  const mp = state.mysteryProgress[region.id];
  if (!mp || mp.solved) return;
  if (!mp.cluesFound.includes(clueKey)) {
    mp.cluesFound.push(clueKey);
    addMsg(`<span class="msg-reward">Clue found! (${mp.cluesFound.length} clues for ${region.name}'s mystery)</span>`, 'reward');
    if (mp.cluesFound.length >= 3) {
      addMsg(`You have enough clues to attempt solving the mystery of ${region.name}!`, 'system');
    }
  }
  saveState();
}

async function crossTopicChallenge() {
  clearNarrative();
  addMsg(`<div class="msg-challenge"><strong>Cross-Domain Challenge</strong><br>Combine knowledge from different regions to solve this problem!</div>`);

  try {
    const cats = REGIONS.filter(r => { const mp = state.mysteryProgress[r.id]; return mp && mp.cluesFound && mp.cluesFound.length >= 2; }).map(r => r.categories[0]);
    if (cats.length < 2) { addMsg('Not enough domain experience for cross-domain challenges.', 'system'); clearNarrative(); showWorldMap(); return; }

    const insights = await api(`/api/topics/insights?categories=${encodeURIComponent(cats.join(','))}`);
    if (insights.length < 2) { addMsg('Could not find cross-domain topics.', 'system'); clearNarrative(); showWorldMap(); return; }

    const [topicA, topicB] = [insights[0], insights[1]];
    const question = `How does ${topicA.topic} (${topicA.category}) relate to ${topicB.topic} (${topicB.category})?`;
    addMsg(`<div class="msg-cascade"><h4>Cross-Domain Synthesis</h4><p>${question}</p></div>`);

    showChoices([{ text: 'Explain the connection (type below)', id: 'explain' }], async (choice) => {
      if (choice.freeformInput) {
        const correctAnswer = `${topicA.key_insight || topicA.tldr || topicA.topic} connects to ${topicB.key_insight || topicB.tldr || topicB.topic}`;
        const result = await evaluateAnswer(choice.freeformInput, correctAnswer, question);
        if (result.grade === 'correct') {
          addMsg(`Excellent cross-domain insight!`, 'success');
          if (result.feedback) addMsg(`<em>${result.feedback}</em>`, 'system');
          state.crossTopicSolved++;
          onCorrectAnswer();
        } else {
          addMsg(`The connection isn't quite there yet.`, 'system');
          if (result.feedback) addMsg(`<em>${result.feedback}</em>`, 'system');
          addMsg(`<div class="knowledge-reveal"><h4>Connection</h4><p>${correctAnswer}</p></div>`);
          if (result.grade === 'partial') onPartialAnswer(); else onIncorrectAnswer();
        }
      }
      saveState(); updateHUD();
      clearNarrative(); showWorldMap();
    });
  } catch (e) {
    addMsg('Could not load cross-domain challenge.', 'system');
    clearNarrative(); showWorldMap();
  }
}

// ============================================================
// CONTINUE OR MAP
// ============================================================
async function continueOrMap(region) {
  // Check mystery solve
  const mp = state.mysteryProgress[region.id];
  if (mp && !mp.solved && mp.cluesFound && mp.cluesFound.length >= 3) {
    addMsg(`<div class="msg-cascade"><strong>Mystery ready to solve!</strong> You have enough clues for ${region.name}'s mystery.</div>`);
    showChoices([
      { text: 'Attempt to solve the mystery', id: 'mystery' },
      { text: 'Continue exploring', id: 'continue' },
      { text: 'Return to the map', id: 'map' },
    ], async (choice) => {
      if (choice.id === 'mystery') { await attemptMystery(region); }
      else if (choice.id === 'continue') { clearNarrative(); await enterRegion(region); }
      else { clearNarrative(); showWorldMap(); }
    });
    return;
  }

  showChoices([
    { text: 'Continue exploring', id: 'continue' },
    { text: 'Return to the map', id: 'map' },
  ], async (choice) => {
    if (choice.id === 'continue') { clearNarrative(); await enterRegion(region); }
    else { clearNarrative(); showWorldMap(); }
  });
}

async function attemptMystery(region) {
  addMsg(`<div class="msg-challenge"><strong>Mystery: ${region.name}</strong><br>${region.mystery}</div>`);
  addMsg(`Using your collected clues, explain the root cause.`);

  showChoices([{ text: 'Solve the mystery (type below)', id: 'solve' }], async (choice) => {
    if (choice.freeformInput) {
      const result = await evaluateAnswer(choice.freeformInput, region.mysteryAnswer, `Mystery: ${region.mystery}`);
      if (result.grade === 'correct' || result.grade === 'partial') {
        state.mysteryProgress[region.id].solved = true;
        addMsg(`<div class="achievement-banner"><h4>Mystery Solved: ${region.name}!</h4><p>${region.mysteryAnswer}</p></div>`);
        if (result.feedback) addMsg(`<em>${result.feedback}</em>`, 'system');
        checkAchievement('mystery_1');
        const allSolved = REGIONS.every(r => state.mysteryProgress[r.id]?.solved);
        if (allSolved) checkAchievement('mystery_all');
        onCorrectAnswer();
      } else {
        addMsg(`Not quite the right explanation. Keep gathering clues.`, 'system');
        if (result.feedback) addMsg(`<em>${result.feedback}</em>`, 'system');
        onIncorrectAnswer();
      }
    }
    saveState(); updateHUD();
    await continueOrMap(region);
  });
}

// ============================================================
// SAVE / LOAD
// ============================================================
function saveState() {
  try {
    localStorage.setItem('knowledge-quest-save', JSON.stringify({
      char: state.char,
      masteredTopics: state.masteredTopics,
      visitedRegions: state.visitedRegions,
      turnCount: state.turnCount,
      mysteryProgress: state.mysteryProgress,
      hintsUsed: state.hintsUsed,
      crossTopicSolved: state.crossTopicSolved || 0,
      conceptCascadesTriggered: state.conceptCascadesTriggered || [],
      knowledgeJournal: state.knowledgeJournal || [],
      tutorialComplete: state.tutorialComplete || false,
      regionNPCs: state.regionNPCs || {},
      lastEncounteredTopic: state.lastEncounteredTopic || null,
      cascadeEncountersSinceLastTrigger: state.cascadeEncountersSinceLastTrigger || {},
      streak: state.streak || 0,
      bestStreak: state.bestStreak || 0,
      combo: 0, // combo resets on reload
      achievements: state.achievements || [],
      totalCorrect: state.totalCorrect || 0,
      totalAttempts: state.totalAttempts || 0,
      dailyChallengesCompleted: state.dailyChallengesCompleted || {},
      apprenticeTeachCount: state.apprenticeTeachCount || 0,
    }));
  } catch (e) {}
}

function loadState() {
  try {
    const saved = localStorage.getItem('knowledge-quest-save');
    if (saved) {
      const data = JSON.parse(saved);
      Object.assign(state, {
        char: data.char,
        masteredTopics: data.masteredTopics || {},
        visitedRegions: data.visitedRegions || [],
        turnCount: data.turnCount || 0,
        mysteryProgress: data.mysteryProgress || {},
        hintsUsed: data.hintsUsed || 0,
        crossTopicSolved: data.crossTopicSolved || 0,
        conceptCascadesTriggered: data.conceptCascadesTriggered || [],
        knowledgeJournal: data.knowledgeJournal || [],
        tutorialComplete: data.tutorialComplete || false,
        regionNPCs: data.regionNPCs || {},
        lastEncounteredTopic: data.lastEncounteredTopic || null,
        cascadeEncountersSinceLastTrigger: data.cascadeEncountersSinceLastTrigger || {},
        streak: data.streak || 0,
        bestStreak: data.bestStreak || 0,
        combo: 0,
        achievements: data.achievements || [],
        totalCorrect: data.totalCorrect || 0,
        totalAttempts: data.totalAttempts || 0,
        dailyChallengesCompleted: data.dailyChallengesCompleted || {},
        apprenticeTeachCount: data.apprenticeTeachCount || 0,
      });
      // Migrate old mastery entries
      Object.values(state.masteredTopics).forEach(entry => {
        if (!entry.halfLife) entry.halfLife = HALF_LIFE_INITIAL_MS;
        if (!entry.lastReviewed) entry.lastReviewed = entry.lastSeen || Date.now();
      });
      // Migrate: if old save has class system, strip it
      if (state.char && state.char.class) {
        state.char = { name: state.char.name };
      }
      return true;
    }
  } catch (e) {}
  return false;
}

// ============================================================
// THEME + FONT
// ============================================================
function initThemeToggle() {
  const btn = document.getElementById('theme-toggle');
  const savedTheme = localStorage.getItem('kq-theme');
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  btn.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('kq-theme', next);
  });
}

function initFontToggle() {
  const btn = document.getElementById('font-toggle');
  const savedSize = localStorage.getItem('kq-fontsize') || 'medium';
  document.documentElement.setAttribute('data-fontsize', savedSize);
  updateFontToggleLabel(savedSize);
  btn.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-fontsize') || 'medium';
    const currentIdx = FONT_SIZES.indexOf(current);
    const next = FONT_SIZES[(currentIdx + 1) % FONT_SIZES.length];
    document.documentElement.setAttribute('data-fontsize', next);
    localStorage.setItem('kq-fontsize', next);
    updateFontToggleLabel(next);
  });
}

function updateFontToggleLabel(size) {
  const btn = document.getElementById('font-toggle');
  const labels = { small: 'Aa-', medium: 'Aa', large: 'Aa+' };
  btn.textContent = labels[size] || 'Aa';
  btn.title = `Font size: ${size}`;
}

// ============================================================
// INIT
// ============================================================
async function init() {
  initThemeToggle();
  initFontToggle();
  initHelpToggle();
  try {
    state.dbStats = await api('/api/stats');
    if (state.dbStats.documents === 0) {
      document.getElementById('loading').innerHTML = '<p>Knowledge base is empty. Run the importer first.</p>';
      return;
    }
    if (loadState()) {
      document.getElementById('loading').style.display = 'none';
      state.phase = 'playing';
      document.getElementById('narrative').style.display = 'block';
      document.getElementById('actions').style.display = 'block';
      document.getElementById('footer').style.display = 'block';
      updateHUD();
      const title = getTitle();
      addMsg(`Welcome back, ${state.char.name}! ${getMasteredCount()} topics mastered. Title: ${title.name}.`, 'system');
      const fading = getFadingTopics();
      if (fading.length > 0) addMsg(`<span style="color:var(--danger);">Warning: ${fading.length} topic(s) fading from memory!</span>`, 'system');
      if (!isDailyChallengeCompleted()) addMsg(`<span class="daily-badge">DAILY</span> A daily challenge is available!`, 'system');
      showWorldMap();
    } else {
      initCharCreation();
    }
  } catch (err) {
    document.getElementById('loading').innerHTML = `<p>Could not connect. Is Docker running?</p><p style="color:var(--danger)">${err.message}</p>`;
  }
}

init();
